increase its bid if the current one looks likely to fail.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 10, "g": "N47", "p": "’ Unigroup, the hotel chain, has recently announced that it will close its headquarters in London as part of its attempt to reduce costs ahead of its break-up. The group, currently fighting off a takeover bid from Rockford Investments, is keen to show shareholders it can save £100m as part of its defense. It is also selling hotels in London and several more in the US. Unigroup has started a program there for making staff redundant and is considering further job cuts across Europe. Unigroup spent Friday putting forward its arguments to shareholders. It is understood that the shareholders have asked the company to postpone the meeting at which they will vote on Rockford the chance to reconsider the package it is offering, parts of which were criticized by its own shareholders. Rockford has maintained that Unigroup shareholders have given it a friendly reception, but refused to comment on its bid, currently worth 648p per share. The battle increased last Friday when Unigroup management complained to the Takeover Board about negative comments a Rockford representative had made about the company at a press conference earlier that day. Rockford later apologized for what its representative had said."}, {"q": "This is the first year that Loyalty customers are paying less for their house insurance.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 11, "g": "N48", "p": "GOOD NEWS FROM AN INSURANCE COMPANY\nCustomer loyalty is an important issue for the insurance sector since retaining a customer cost much less than acquiring new ones. The best way to build customer loyalty is to make sure that the customers are satisfied with the services they have subscribed to, and in the insurance industry, the quality of the services will be tested especially when a claim is filed.\nFor the fifth year in a row, the Loyalty Insurance Company has cut the cost of its house insurance. More than a million people with homes insured by the company will benefit from decreases of between two and four percent on the amount they will have to pay this year. This move goes against the market trend, with other insures increasing rates by an average one percent.\n‘The level of claims has been lower than usual over this period, allowing us to make these welcome reductions,’ says Malcolm Broad, Loyalty’s general manager.\nAlthough the cost of insuring a car with Loyalty has increased by six percent this year, it is still the smallest rise in the insurance industry; most other companies’ rates are, on average, ten percent higher than they were last year.\n‘The company has always believed in passing on any improvement in its financial position to its customers,’ says Mr. Broad. “Without doubt, this has led to a continual expansion of our business over the past few years.’"}, {"q": "Insuring a house with Loyalty will be at least four percent cheaper than last year.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 12, "g": "N48", "p": "GOOD NEWS FROM AN INSURANCE COMPANY\nCustomer loyalty is an important issue for the insurance sector since retaining a customer cost much less than acquiring new ones. The best way to build customer loyalty is to make sure that the customers are satisfied with the services they have subscribed to, and in the insurance industry, the quality of the services will be tested especially when a claim is filed.\nFor the fifth year in a row, the Loyalty Insurance Company has cut the cost of its house insurance. More than a million people with homes insured by the company will benefit from decreases of between two and four percent on the amount they will have to pay this year. This move goes against the market trend, with other insures increasing rates by an average one percent.\n‘The level of claims has been lower than usual over this period, allowing us to make these welcome reductions,’ says Malcolm Broad, Loyalty’s general manager.\nAlthough the cost of insuring a car with Loyalty has increased by six percent this year, it is still the smallest rise in the insurance industry; most other companies’ rates are, on average, ten percent higher than they were last year.\n‘The company has always believed in passing on any improvement in its financial position to its customers,’ says Mr. Broad. “Without doubt, this has led to a continual expansion of our business over the past few years.’"}, {"q": "Loyalty is performing in a different way from other insurance companies.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 13, "g": "N48", "p": "GOOD NEWS FROM AN INSURANCE COMPANY\nCustomer loyalty is an important issue for the insurance sector since retaining a customer cost much less than acquiring new ones. The best way to build customer loyalty is to make sure that the customers are satisfied with the services they have subscribed to, and in the insurance industry, the quality of the services will be tested especially when a claim is filed.\nFor the fifth year in a row, the Loyalty Insurance Company has cut the cost of its house insurance. More than a million people with homes insured by the company will benefit from decreases of between two and four percent on the amount they will have to pay this year. This move goes against the market trend, with other insures increasing rates by an average one percent.\n‘The level of claims has been lower than usual over this period, allowing us to make these welcome reductions,’ says Malcolm Broad, Loyalty’s general manager.\nAlthough the cost of insuring a car with Loyalty has increased by six percent this year, it is still the smallest rise in the insurance industry; most other companies’ rates are, on average, ten percent higher than they were last year.\n‘The company has always believed in passing on any improvement in its financial position to its customers,’ says Mr. Broad. “Without doubt, this has led to a continual expansion of our business over the past few years.’"}, {"q": "Loyalty’s car insurance is currently the cheapest available.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 14, "g": "N48", "p": "GOOD NEWS FROM AN INSURANCE COMPANY\nCustomer loyalty is an important issue for the insurance sector since retaining a customer cost much less than acquiring new ones. The best way to build customer loyalty is to make sure that the customers are satisfied with the services they have subscribed to, and in the insurance industry, the quality of the services will be tested especially when a claim is filed.\nFor the fifth year in a row, the Loyalty Insurance Company has cut the cost of its house insurance. More than a million people with homes insured by the company will benefit from decreases of between two and four percent on the amount they will have to pay this year. This move goes against the market trend, with other insures increasing rates by an average one percent.\n‘The level of claims has been lower than usual over this period, allowing us to make these welcome reductions,’ says Malcolm Broad, Loyalty’s general manager.\nAlthough the cost of insuring a car with Loyalty has increased by six percent this year, it is still the smallest rise in the insurance industry; most other companies’ rates are, on average, ten percent higher than they were last year.\n‘The company has always believed in passing on any improvement in its financial position to its customers,’ says Mr. Broad. “Without doubt, this has led to a continual expansion of our business over the past few years.’"}, {"q": "It is Loyalty’s policy to share its success with its customers.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 15, "g": "N48", "p": "GOOD NEWS FROM AN INSURANCE COMPANY\nCustomer loyalty is an important issue for the insurance sector since retaining a customer cost much less than acquiring new ones. The best way to build customer loyalty is to make sure that the customers are satisfied with the services they have subscribed to, and in the insurance industry, the quality of the services will be tested especially when a claim is filed.\nFor the fifth year in a row, the Loyalty Insurance Company has cut the cost of its house insurance. More than a million people with homes insured by the company will benefit from decreases of between two and four percent on the amount they will have to pay this year. This move goes against the market trend, with other insures increasing rates by an average one percent.\n‘The level of claims has been lower than usual over this period, allowing us to make these welcome reductions,’ says Malcolm Broad, Loyalty’s general manager.\nAlthough the cost of insuring a car with Loyalty has increased by six percent this year, it is still the smallest rise in the insurance industry; most other companies’ rates are, on average, ten percent higher than they were last year.\n‘The company has always believed in passing on any improvement in its financial position to its customers,’ says Mr. Broad. “Without doubt, this has led to a continual expansion of our business over the past few years.’"}, {"q": "Sheffield was for a long time a leader in the production of steel.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 16, "g": "N49", "p": "’ Records show that tools were being made in Sheffield as long ago as the 13 th century. The city not only produced steel and made metal goods, b ut also pioneered the processes by which they were made; for example, the first stainless steel was produced in 1913. The first large-scale works in Sheffield each employed up to 500 workers. But these were dwarfed by the massive steel and engineering works that grew up in the east of the city after the 1890s. During its peak, Sheffield was producing 90% of all British-made steel and 50% of all that made in Europe. The metal industries were secretly hit in the late 1970s and 1980s. There was overcapacity in Europe, and the government of the 1979 was not prepared to continue subscribing the industry. After the 13-week national steel strike in 1980, the steel, engineering and metal manufacturing industries suffered huge redundancies. In 1981, there were 27,000 jobs in steel production in Sheffield and 43,000 in engineering and metal manufacturing. By 1991, there were just 7,000 jobs in steel and fewer than 30,000 in engineering and metal manufacturing. Although heavy industry now plays a much-reduced role, for the past six years Sheffield has had the fastest growing city economy outside London."}, {"q": "The factories built in the east of Sheffield after 1890 were larger than the earlier ones.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 17, "g": "N49", "p": "’ Records show that tools were being made in Sheffield as long ago as the 13 th century. The city not only produced steel and made metal goods, b ut also pioneered the processes by which they were made; for example, the first stainless steel was produced in 1913. The first large-scale works in Sheffield each employed up to 500 workers. But these were dwarfed by the massive steel and engineering works that grew up in the east of the city after the 1890s. During its peak, Sheffield was producing 90% of all British-made steel and 50% of all that made in Europe. The metal industries were secretly hit in the late 1970s and 1980s. There was overcapacity in Europe, and the government of the 1979 was not prepared to continue subscribing the industry. After the 13-week national steel strike in 1980, the steel, engineering and metal manufacturing industries suffered huge redundancies. In 1981, there were 27,000 jobs in steel production in Sheffield and 43,000 in engineering and metal manufacturing. By 1991, there were just 7,000 jobs in steel and fewer than 30,000 in engineering and metal manufacturing. Although heavy industry now plays a much-reduced role, for the past six years Sheffield has had the fastest growing city economy outside London."}, {"q": "At its height, Sheffield wa l and fewer than 30,000 in engineering and metal manufacturing. Although heavy industry now plays a much-reduced role, for the past six years Sheffield has had the fastest growing city economy outside London."}, {"q": "To join the Leadership program, you need to have a university degree.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 21, "g": "N50", "p": "Woolworths graduate training program\nOur graduate recruits are our next generation of business leaders.\nWhen you join us, you’ll enroll on our Woolworths Group Leadership Program (WGLP) which will put you on the fast track to a senior management role in one of our central functions (e.g., buying, finance, supply chain, systems, human resources or marketing).\nYou’ll undertake a comprehensive program of training in general management techniques and specialist skills relevant to your functional discipline. With input from leading business academics at City University, the WGLP will expose you to the latest strategic business thinking. You’ll also receive support as you pursue professional qualifications in your field.\nYour first few months will be spent working alongside a store management team. You’ll learn the essential store management disciplines and gain insight into our customers, brands and products. After that, you’ll join your functional team where you’ll take on meaningful responsibility from the word go.\nYou’ll be mentored by senior managers who have already established themselves in the business, and you’ll be part of a group-wide network of WGLP participants. There will also be opportunities for you to move between companies as you develop your career."}, {"q": "Enrolment on the program guarantees you a job as a senior manager.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 22, "g": "N50", "p": "Woolworths graduate training program\nOur graduate recruits are our next generation of business leaders.\nWhen you join us, you’ll enroll on our Woolworths Group Leadership Program (WGLP) which will onally during the training program.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 25, "g": "N50", "p": "Woolworths graduate training program\nOur graduate recruits are our next generation of business leaders.\nWhen you join us, you’ll enroll on our Woolworths Group Leadership Program (WGLP) which will put you on the fast track to a senior management role in one of our central functions (e.g., buying, finance, supply chain, systems, human resources or marketing).\nYou’ll undertake a comprehensive program of training in general management techniques and specialist skills relevant to your functional discipline. With input from leading business academics at City University, the WGLP will expose you to the latest strategic business thinking. You’ll also receive support as you pursue professional qualifications in your field.\nYour first few months will be spent working alongside a store management team. You’ll learn the essential store management disciplines and gain insight into our customers, brands and products. After that, you’ll join your functional team where you’ll take on meaningful responsibility from the word go.\nYou’ll be mentored by senior managers who have already established themselves in the business, and you’ll be part of a group-wide network of WGLP participants. There will also be opportunities for you to move between companies as you develop your career."}, {"q": "It is simple to buy a franchise operation.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 26, "g": "N51", "p": "Franchising: ask the right questions and you should be on the road to success in your venture, advises Michael Becket.\nFranchising operators seem to have a simple approach when it comes to recruiting. ‘Don’t worry about what sort of work we’re doing, just roll up your sleeves and get down to it.’ Potential franchisees glancing through magazine advertisements could struggle to find out what line of business they are chasing because the wording is so vague.\nIt all seems ibition and conference center show the industry is producing a turnover of £91⁄2 billion a year and providing more than 326,000 jobs.\nThe initial start-up cost is now averaging £59,200 and the typical franchise is generating a turnover of almost £300,000 a year while 91% of franchisees say they are making money.\nIt is impressive, but most of the large and reputable franchise operations complain they are suffering from a shortage of “suitable applicants”. More than 40% of franchisors say the biggest barrier to growth is a lack of franchisees they feel will make the grade."}, {"q": "15 years ago, manufacturers paid less for raw commodities than they do today.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 31, "g": "N52", "p": "You probably know the statistics: whatever you pay for a jar of coffee in a supermarket, half goes to the manufacturer, a third to the supermarket itself, ten percent to the plantation where the coffee was grown, and about seven percent to the worker who picked the beans in the first place. The situation is getting worse: prices for raw commodities are now worth less than half what they were 15 years ago.\nIn the past ten years, the fair-trade movement has developed to provide an alternative to this situation. Fair trade organizations do business directly with producers in the developing world, cutting out the middlemen, and so they make sure that the maximum profit is returned to source. Fair trade also guarantees stability for producers and protects them against fluctuations in the market by offering secure, long-term prices which are over and above the market rate. Many schemes also offer prepayment or access to credit.\nThe fair-trade movement is not only restricted to foodstuffs. Crafts, clothing, jewelry and furniture are fairly traded in the same way – and the movement is growing. Around 1,700 world shops and fair-trade groups took part in the first European World Shop Day, in Day 1996, and there are now fair-trade organizations throughout the world. Public opinion surveys repeatedly show that people are happy to spend more money for fairly traded goods; Cafidirect, the first product to carry the Fairtrade Mark in Britain, is now the third best-selling coffee in one supermarket chain."}, {"q": "The fair-trade movement had been in existence for about a decade.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 32, "g": "N52", "p": "You probably know the statistics: whatever you pay for a jar of coffee in a supermarket, half goes to the manufacturer, a third to the supermarket itself, ten percent to the plantation where the coffee was grown, and about seven percent to the worker who picked the beans in the first place. The situation is getting worse: prices for raw commodities are now worth less than half what they were 15 years ago.\nIn the past ten years, the fair-trade movement has developed to provide an alternative to this situation. Fair trade organizations do business directly with producers in the developing world, cutting out the middlemen, and so they make sure that the maximum profit is returned to source. Fair trade also guarantees stability for producers and protects them against fluctuations in the market by offering secure, long-term prices which are over and above the market rate. Many schemes also offer prepayment or access to credit.\nThe fair-trade movement is not only restricted to foodstuffs. Crafts, clothing, jewelry and furniture are fairly traded in the same way – and the movement is growing. Around 1,700 world shops and fair-trade groups took part in the first European World Shop Day, in Day 1996, and there are now fair-trade organizations throughout the world. Public opinion surveys repeatedly show that people are happy to spend more money for fairly traded goods; Cafidirect, the first product to carry the Fairtrade Mark in Britain, is now the third best-selling coffee in one supermarket chain."}, {"q": "Fair trade organizations try to stop producers being exploited." ALSE", "NOT GIVEN"], "a": 2, "n": 46, "g": "N55", "p": "Unemployment has costs to a society that are more than just financial. Unemployed individuals not only lose income but also face challenges to their physical and mental health. Societal costs of high unemployment include higher crime and a reduced rate of volunteerism.\nMore than one in six young people are out of work, raising fears of a ‘lost generation’ of potential workers, as unemployment hit a 14-year high. Even McDonald’s - a brand synonymous with today’s youth – appeared to anger its main customer base with a new campaign to boost the recruitment of older staff. According to a Lancaster University study commissioned by the company, customer satisfaction was 20 percent higher in those branches employing workers over 60. At present, 1,000 of McDonald’s 75,000 workers in Britain are over 60.\nYoung people were granted some hope yesterday as Morrisons, Britain’s fourth-largest supermarket, said that it would employ an extra 2,000 workers this year. As job losses have increased significantly during the recession, supermarkets have been among the biggest recruiters. Morrisons said yesterday that a third of the new jobs would be filled by recruits aged 18 to 24. The jobs include vacancies for butchers, bakers and fishmongers as well as checkout operators. Morrisons trains staff through its own food academy and is aiming to have trained 100,000 workers to NVQ Level 2 by next spring."}, {"q": "In McDonald’s, customer satisfaction is partly dependent on who the customers are served by.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 47, "g": "N55", "p": "Unemployment has costs to a society that are more than just financial. Unemployed individuals not only lose income but also face challenges to their physical and mental health. Societal costs of high unemployment include higher crime and a reduced rate of volunteerism.\nMore than one in six young people are out of work, raising fears of a ‘lost generation’ of
