
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website Ôn Thi</title>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #120020, #154355);
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    /* TOP DONATE */
    .top-donate {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 340px;
      height: 38px;
      margin-bottom: 15px;
      padding: 0 10px;
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);

      border: 1px solid rgba(0, 225, 255, 0.3);
      box-shadow: inset 0 1px 2px rgba(255,255,255,0.15);

      overflow: hidden;
    }

    .donate-title {
      flex-shrink: 0;
      color: #00e1ff;
      font-size: 12px;
      font-weight: bold;
      margin-right: 10px;
      white-space: nowrap;
    }

    .donate-marquee {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
    }

    .donate-content {
      display: flex;
      width: max-content;
      animation: donateScroll 15s linear infinite;
    }

    .donate-content span {
      color: white;
      font-size: 12px;
      padding-right: 35px;
    }

    @keyframes donateScroll {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }

    .top-donate:hover .donate-content {
      animation-play-state: paused;
    }

    /* Avatar */
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 3px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #00e1ff, #8a2be2);
      box-shadow: 0 0 15px rgba(0, 225, 255, 0.6);
      transition: transform 0.3s ease;
    }

    .avatar:hover {
      transform: scale(1.05);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    /* Typing text */
    h1 {
      font-size: 32px;
      font-family: monospace;
      border-right: 3px solid #00e1ff;
      white-space: nowrap;
      overflow: hidden;
      animation: blink 0.7s infinite;
      min-height: 40px;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .desc {
      font-size: 14px;
      color: #bbb;
      margin: 15px 0 25px;
    }

    /* Social icons container */
    .socials {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      max-width: 340px;
    }

    /* Liquid Glass */
    .socials a {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 14px 20px;
      text-decoration: none;
      color: #ffffff;
      font-size: 16px;
      font-weight: 500;
      border-radius: 16px;

      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.25),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.3);

      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .socials a i {
      font-size: 22px;
      color: #00e1ff;
      width: 32px;
      text-align: center;
      margin-right: 15px;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .socials a::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.25),
        transparent
      );
      transition: left 0.6s ease;
    }

    .socials a:hover::before {
      left: 100%;
    }

    .socials a:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(0, 225, 255, 0.5);
      box-shadow: 0 8px 25px rgba(0, 225, 255, 0.3),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.5);
      transform: translateY(-3px);
      color: #00e1ff;
    }

    .socials a:hover i {
      transform: scale(1.15);
      color: #00ffff;
    }

    .badge {
      margin-left: auto;
      font-size: 11px;
      background: rgba(0, 225, 255, 0.2);
      color: #00e1ff;
      padding: 3px 8px;
      border-radius: 12px;
      border: 1px solid rgba(0, 225, 255, 0.4);
    }

    footer {
      font-size: 12px;
      color: #888;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TOP DONATE -->
    <div class="top-donate">
      <span class="donate-title">Top donate:</span>

      <div class="donate-marquee">
        <div class="donate-content">
          <span>Nguyễn Tuấn Tài - 36.936đ</span>
          <span>Nguyễn Sỹ Quang - 30.000đ</span>

          <!-- Lặp lại để chạy liên tục -->
          <span>Nguyễn Tuấn Tài - 36.936đ</span>
          <span>Nguyễn Sỹ Quang - 30.000đ</span>
        </div>
      </div>
    </div>

    <!-- Avatar -->
    <div class="avatar">
      <img src="avt2.png" alt="avatar">
    </div>

    <!-- Text typing -->
    <h1 id="text"></h1>

    <!-- Danh sách các trang ôn thi -->
    <div class="socials">

      <a href="KTCT.html">
        <i class="fas fa-scale-balanced"></i>
        <span>Kinh Tế Chính Trị</span>
        <span class="badge">240 câu</span>
      </a>

      <a href="KiTCB_On_Thi_200_cau.html">
        <i class="fas fa-file-invoice-dollar"></i>
        <span>Kiểm Toán Căn Bản</span>
        <span class="badge">200 câu</span>
      </a>

      <a href="NCKH_On_Thi_30_cau.html">
        <i class="fas fa-graduation-cap"></i>
        <span>Phương Pháp Nghiên Cứu</span>
        <span class="badge">1 lồn câu</span>

      <a href="#" style="opacity: 0.6; cursor: default;">
        <i class="fas fa-book-open"></i>
        <span>...</span>
        <span class="badge">abcxyz</span>
      </a>

    </div>
  </div>

  <footer>
    © Thanh Dat!
  </footer>

  <script>
    const text = "donate tuy tam";
    let i = 0;

    function typeEffect() {
      const el = document.getElementById("text");

      if (i <= text.length) {
        el.textContent = text.slice(0, i);
        i++;
        setTimeout(typeEffect, 120);
      } else {
        setTimeout(() => {
          i = 0;
          typeEffect();
        }, 1500);
      }
    }

    typeEffect();
  </script>

</body>
</html>
