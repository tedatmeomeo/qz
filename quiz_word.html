Please take a look. There are pictures of all the new models in our sales _______!", "o": ["album", "diary", "expectation", "catalogue"], "a": 3, "n": 12}, {"q": "New graduates should visit job fairs to see what sort of jobs employers are offering and what kind of people they are looking to _______.", "o": ["hire", "promote", "request", "retire"], "a": 0, "n": 13}, {"q": "At the annual meeting, the sales and marketing departments can exchange _______ and develop a common vocabulary for better business strategies.", "o": ["feedback", "features", "anticipation", "capital"], "a": 0, "n": 14}, {"q": "When you ________ an interview, remember to wear formally and bring some samples of your work.", "o": ["attend", "insure", "apply", "recruit"], "a": 0, "n": 15}, {"q": "Once we were equipped with the latest technology, _______ rose rapidly and we were able to increase the sales significantly.", "o": ["bonus", "brand", "attraction", "productivity"], "a": 3, "n": 16}, {"q": "At the beginning of your career _______, the most important thing is to find a job that you can learn a lot to develop your skills.", "o": ["connection", "attention", "resume", "path"], "a": 3, "n": 17}, {"q": "The new CEO _______ his employees to work overtime to finish their project without paying any extra money.", "o": ["retired", "hired", "requested", "promoted"], "a": 2, "n": 18}, {"q": "For some people, family _______ can help them get their dream job, like Stella McCartney or Ivanka Trump.", "o": ["attentions", "connections", "resumes", "paths"], "a": 1, "n": 19}, {"q": "The customers required us to send them the latest _______ so that they could know about the prices of our services before they make a purchase.", "o": ["enquiries", "quotations", "anticipations", "revenues"], "a": 1, "n": 20}, {"q": "A prospective customer can browse through the FAQs (frequently asked questions) or can read product users' entries in an online _______ to know more about the company.", "o": ["attraction", "forum", " at shouldn’t be included in e-mails. Which one DOESN’T appear in the article?", "o": ["Comments on competition", "Complaints about people you work with", "Trade secrets", "Bank-account details"], "a": 3, "n": 1, "g": "Reading (1)", "p": "When new employees start at Goldman Sachs, one of the first things they are told is that they should not put anything in an e-mail that they wouldn’t want to read in the newspaper. Don’t complain about colleagues. Don’t discuss sensitive deals. Don’t say bad things about the competition. If you want to do those things, use the phone or talk to someone in person.\n\nThe same warning has been repeated across the corporate world for years, but the message never seems to get through. Sensitive e-mails and instant messages continue to turn up in public.\n\nIt seems that no matter how often they are told, employees continue to see workplace e-mails as casual, private exchanges that no one else will read. The ePolicy Institute, which conducts research and advises companies, recently carried out a survey of 416 companies. The survey showed that only 42% of companies conduct any formal training regarding e-mail usage. Instead, they rely on written policies that are often not read.\n\nSimply telling workers to be more careful is not enough. Some companies are now using advanced software that can block potentially embarrassing messages from leaving a corporate system.\n\nProofpoint, an electronic security company, offers software that monitors message as they arrive and depart to detect potentially dangerous words or phrases. Keith Crosley, Director of Market Development for Proofpoint, says heavily regulated industries, such as financial services and health care, are among his company’s best customers. Kawasaki Motors uses the software to make sure no one leaks its motorcycle designs. The software ensures that personal data such as credit-card numbers and medical histories are encrypted and monitors the disclosure of confidential corporate information."}, {"q": "If they want to discuss sensitive deals, Goldman Sachs employees are told not to _______.", "o": ["use the phone.", "use e-mail.", "talk to a person inside the company.", "keep secret."], "a": 1, "n": 2, "g": "Reading (1)", "p": "When new employees start at Goldman Sachs, one of the first things they are told is that they should not put anything in an e-mail that they wouldn’t want to read in the newspaper. Don’t complain about colleagues. Don’t discuss sensitive deals. Don’t say bad things about the competition. If you want to do those things, use the phone or talk to someone in person.\n\nThe same warning has been repeated across the corporate world for years, but the message never seems to get through. Sensitive e-mails and instant messages continue to turn up in public.\n\nIt seems that no matter how often they are told, employees continue to see workplace e-mails as casual, private exchanges that no one else will read. The ePolicy Institute, which conducts research and advises companies, recently carried out a survey of 416 companies. The survey showed that only 42% of companies conduct any formal training regarding e-mail usage. Instead, they rely on written policies that are often not read.\n\nSimply telling workers to be more careful is not enough. Some companies are now using advanced software that can block potentially embarrassing messages from leaving a corporate system.\n\nProofpoint, an electronic security company, offers software that monitors message as they arrive and depart to detect potentially dangerous words or phrases. Keith Crosley, Director of Market Development for Proofpoint, says heavily regulated industries, such as financial services and health care, are among his company’s best customers. Kawasaki Motors uses the software to make sure no one leaks its motorcycle designs. The software ensures that personal data such as credit-card numbers and medical histories are encrypted and monitors the disclosure of confidential corporate information."}, {"q": "According to an ePolicy survey, most companies _______.", "o": ["use a team leader to monitor the issue", "use special software to block sensitive messages.", "organize training programs to instruct employees how to use e-mail.", "send only written instructions about using e-mail."], "a": 3, "n": 3, "g": "Reading (1)", "p": "When new employees start at Goldman Sachs, one of the first things they are told is that they should not put anything in an e-mail that they wouldn’t want to read in the newspaper. Don’t complain about colleagues. Don’t discuss sensitive deals. Don’t say bad things about the competition. If you want to do those things, use the phone or talk to someone in person.\n\nThe same warning has been repeated across the corporate world for years, but the message never seems to get through. Sensitive e-mails and instant messages continue to turn up in public.\n\nIt seems that no matter how often they are told, employees continue to see workplace e-mails as casual, private exchanges that no one else will read. The ePolicy Institute, which conducts research and advises companies, recently carried out a survey of 416 companies. The survey showed that only 42% of companies conduct any formal training regarding e-mail usage. Instead, they rely on written policies that are often not read.\n\nSimply telling workers to be more careful is not enough. Some companies are now using advanced software that can block potentially embarrassing messages from leaving a corporate system.\n\nProofpoint, an electronic security company, offers software that monitors message as they arrive and depart to detect potentially dangerous words or phrases. Keith Crosley, Director of Market Development for Proofpoint, says heavily regulated industries, such as financial services and health care, are among his company’s best customers. Kawasaki Motors uses the software to make sure no one leaks its motorcycle designs. The software ensures that personal data such as credit-card numbers and medical histories are encrypted and monitors the disclosure of confidential corporate information."}, {"q": "According to the passage, proofpoint is _______.", "o": ["a kind of software that monitors e-mails", "a company that specializes in electronic security.", "an institute that advises companies on security.", "a new car design of the company."], "a": 1, "n": 4, "g": "Reading (1)", "p": "When new employees start at Goldman Sachs, one of the first things they are told is that they should not put anything in an e-mail that they wouldn’t want to read in the newspaper. Don’t complain about colleagues. Don’t discuss sensitive deals. Don’t say bad things about the competition. If you want to do those things, use the phone or talk to someone in person.\n\nThe same warning has been repeated across the corporate world for years, but the message never seems to get through. Sensitive e-mails and instant messages continue to turn up in public.\n\nIt seems that no matter how often they are told, employees continue to see workplace e-mails as casual, private exchanges that no one else will read. The ePolicy Institute, which conducts research and advises companies, recently carried out a survey of 416 companies. The survey showed that only 42% of companies conduct any formal training regarding e-mail usage. Instead, they rely on written policies that are often not read.\n\nSimply telling workers to be more careful is not enough. Some companies are now using advanced software that can block potentially embarrassing messages from leaving a corporate system.\n\nProofpoint, an electronic security company, offers software that monitors message as they arrive and depart to detect potentially dangerous words or phrases. Keith Crosley, Director of Market Development for Proofpoint, says heavily regulated industries, such as financial services and health care, are among his company’s best customers. Kawasaki Motors uses the software to make sure no one leaks its motorcycle designs. The software ensures that personal data such as credit-card numbers and medical histories are encrypted and monitors the disclosure of confidential corporate information."}, {"q": "Which word is used in the article to mean the same as ‘sensitive’?", "o": ["casual", "instant", "embarrassing", "Private"], "a": 2, "n": 5, "g": "Reading (1)", "p": "When new employees start at Goldman Sachs, one of the first things they are told is that they should not put anything in an e-mail that they wouldn’t want to read in the newspaper. Don’t complain about colleagues. Don’t discuss sensitive deals. Don’t say bad things about the competition. If you want to do those things, use the phone or talk to someone in person.\n\nThe same warning has been repeated across the corporate world for years, but the message never seems to get through. Sensitive e-mails and instant messages continue to turn up in public.\n\nIt seems that no matter how often they are told, employees continue to see workplace e-mails as casual, private exchanges that no one else will read. The ePolicy Institute, which conducts research and advises companies, recently carried out a survey of 416 companies. The survey showed that only 42% of companies conduct any formal training regarding e-mail usage. Instead, they rely on written policies that are often not read.\n\nSimply telling workers to be more careful is not enough. Some companies are now using advanced software that can block potentially embarrassing messages from leaving a corporate system.\n\nProofpoint, an electronic security company, offers software that monitors message as they arrive and depart to detect potentially dangerous words or phrases. Keith Crosley, Director of Market Development for Proofpoint, says heavily regulated industries, such as financial services and health care, are among his company’s best customers. Kawasaki Motors uses the software to make sure no one leaks its motorcycle designs. The software ensures that personal data such as credit-card numbers and medical histories are encrypted and monitors the disclosure of confidential corporate information."}, {"q": "Dyson left the Design Museum because he _______.", "o": ["found it took up too much of his free time.", "no longer agreed with its ideas.", "wanted to concentrate on his own design work.", "would like to enjoy the life"], "a": 1, "n": 6, "g": "Reading (2)", "p": "How can the appearance of a product be more important than its function? This question rose again last week when James Dyson, British inventor of the Dyson bagless vacuum cleaner, resigned as chairman of London’s Design Museum. Dyson felt that the museum put too much emphasis on style and fashion. In his resignation letter, Mr Dyson accused the museum of not keeping true to itself. He may be right, but the Design Museum is just doing what every other museum in the world is doing to increase visitor numbers. \nOn the one hand, some manufacturers can be too old-fashioned and too concerned with the functions of manufactured objects. On the other hand, there are those who believe that how a product looks is more important. Design is indeed a broad term, involving both function and form. Look at clothing: originally its function was to provide warmth, but having long since achieved that objective, its form is now dictated almost entirely by fashion. \nToday, when two products have the same price and similar standard, manufacturers can differentiate their products from those of their competitors by establishing some sorts of emotional connection with the consumer. This could be through the visual appeal of the product or its packaging. Or, it might happen through the imagery created by advertising or branding.\nSo, what of the Dyson vacuum cleaners? Mr. Dyson may believe that people buy these machines because of the graphs on the company website illustrating their superior suction, but I doubt very much whether they do. Most vacuum cleaners do a good job; the main reason people pay extra for a Dyson is because it is a designer vacuum cleaner with a trendy brand. With its internal workings exposed, it is a bit like a Richard Rogers building with all its pipes and ducts displayed in bright colors on the outside instead of being hidden inside. Functional it may be, but it is a bit of a gimmick, too."}, {"q": "What does the article say about museums?", "o": ["They do not need to promote cultural aspects.", "They no longer have to compete with each other.", "They still need to attract more visitors.", "They should try to offer more specialized events."], "a": 2, "n": 7, "g": "Reading (2)", "p": "How can the appearance of a product be more important than its function? This question rose again last week when James Dyson, British inventor of the Dyson bagless vacuum cleaner, resigned as chairman of London’s Design Museum. Dyson felt that the museum put too much emphasis on style and fashion. In his resignation letter, Mr Dyson accused the museum of not keeping true to itself. He may be right, but the Design Museum is just doing what every other museum in the world is doing to increase visitor numbers. \nOn the one hand, some manufacturers can be too old-fashioned and too concerned with the functions of manufactured objects. On the other hand, there are those who believe that how a product looks is more important. Design is indeed a broad term, involving both function and form. Look at clothing: originally its function was to provide warmth, but having long since achieved that objective, its form is now dictated almost entirely by fashion. \nToday, when two products have the same price and similar standard, manufacturers can differentiate their products from those of their competitors by establishing some sorts of emotional connection with the consumer. This could be through the visual appeal of the product or its packaging. Or, it might happen through the imagery created by advertising or branding.\nSo, what of the Dyson v facturers can differentiate their products from those of their competitors by establishing some sorts of emotional connection with the consumer. This could be through the visual appeal of the product or its packaging. Or, it might happen through the imagery created by advertising or branding.\nSo, what of the Dyson vacuum cleaners? Mr. Dyson may believe that people buy these machines because of the graphs on the company website illustrating their superior suction, but I doubt very much whether they do. Most vacuum cleaners do a good job; the main reason people pay extra for a Dyson is because it is a designer vacuum cleaner with a trendy brand. With its internal workings exposed, it is a bit like a Richard Rogers building with all its pipes and ducts displayed in bright colors on the outside instead of being hidden inside. Functional it may be, but it is a bit of a gimmick, too.", "e": "⚠️ File Word bị lẫn các lựa chọn của bài Reading 1 (về e-mail). Mình viết lại 4 lựa chọn dựa trên đoạn văn Dyson; đáp án đúng là câu nói Dyson từ chức vì bảo tàng quá chú trọng phong cách."}, {"q": "The writer believes that people buy the Dyson vacuum cleaner because _______.", "o": ["it has an excellent after-sales service.", "it has a fashionable range.", "it has a life-time guarantee", "it is more reliable."], "a": 1, "n": 9, "g": "Reading (2)", "p": "How can the appearance of a product be more important than its function? This question rose again last week when James Dyson, British inventor of the Dyson bagless vacuum cleaner, resigned as chairman of London’s Design Museum. Dyson felt that the museum put too much emphasis on style and fashion. In his resignation letter, Mr Dyson accused the museum of not keeping true to itself. He may be right, but the Design Museum is just doing what every other museum in the world is doing to increase visitor numbers. \nOn the one hand, some manufacturers can be too old-fashioned and too concerned with the functions of manufactured objects. On ign Museum is just doing what every other museum in the world is doing to increase visitor numbers. \nOn the one hand, some manufacturers can be too old-fashioned and too concerned with the functions of manufactured objects. On the other hand, there are those who believe that how a product looks is more important. Design is indeed a broad term, involving both function and form. Look at clothing: originally its function was to provide warmth, but having long since achieved that objective, its form is now dictated almost entirely by fashion. \nToday, when two products have the same price and similar standard, manufacturers can differentiate their products from those of their competitors by establishing some sorts of emotional connection with the consumer. This could be through the visual appeal of the product or its packaging. Or, it might happen through the imagery created by advertising or branding.\nSo, what of the Dyson vacuum cleaners? Mr. Dyson may believe that people buy these machines because of the graphs on the company website illustrating their superior suction, but I doubt very much whether they do. Most vacuum cleaners do a good job; the main reason people pay extra for a Dyson is because it is a designer vacuum cleaner with a trendy brand. With its internal workings exposed, it is a bit like a Richard Rogers building with all its pipes and ducts displayed in bright colors on the outside instead of being hidden inside. Functional it may be, but it is a bit of a gimmick, too."}, {"q": "According to the article, which GM plant will likely be closed?", "o": ["The plant in Vauxhall, Britain", "The plant in Russelsheim, Germany", "The plant in Ellesmere Port, England", "The plant in Bochum, Germany"], "a": 3, "n": 11, "g": "Reading (3)", "p": "General Motors Co. will build the next generation of its Astra car model in Britain after workers at its factory in Ellesmere Port, northwest England, agreed to a new labor deal, leaving its plant in Bochum, Germany in danger of closure. \nThe U.S. carmaker said on Thursday it would invest 125 million pounds in the Ellesmere Port plant, where assembly of the new vehicle will start in 2015. \nBritain's United union said 94 percent of those balloted voted in favor of changes to working conditions and that some 700 jobs would be created at the plant, securing its future until 2020. \n\"It's almost certain that one of GM's German plants will now be closed, probably the plant in Bochum,\" a source close to the negotiations said. \nGM, which sells under the Vauxhall brand in Britain, is expected to halt production of the Astra, its most important model, at its main plant in Russelsheim, Germany, making the car only at Ellesmere Port and at Poland's Gliwice plant from 2015. \nThe source added that some production of GM's Chevrolet marque could be shifted from Asia to Europe, with Russelsheim the likely beneficiary. This would leave the Opel factory at Bochum as the most likely site to be closed. \nThe decision is one of the most dramatic so far as Europe's carmakers look to restructure or consolidate in response to more than four years of falling demand and profits. \nMany factories are running at partial capacity - analysts estimate automakers have cut some 3 million cars, or 20 percent, from their production lines - and still producers struggle to sell their wares."}, {"q": "The article states that from 2015, the Astra will no longer be produced in ________.", "o": ["Gliwice, Poland", "Russelsheim, Germany", "Ellesmere Port, England", "Bochum, Germany"], "a": 1, "n": 12, "g": "Reading (3)", "p": "General Motors Co. will build the next generation of its Astra car model in Britain after workers at its factory in Ellesmere Port, northwest England, agreed to a new labor deal, leaving its plant in Bochum, Germany in danger of closure. \nThe U.S. carmaker said on Thursday it would invest 125 million pounds in the Ellesmere Port plant, where assembly of the new vehicle will start in 2015. \nBr sta, Focus, Mondeo and other vehicles in China in a three-way tie-up with Chongqing Automobile Co., Ltd. 000625.SZ and Japan's Mazda Motor Corp (7261.T).\nAFP 04/25/2012"}, {"q": "Which Ford car is NOT mentioned in the article?", "o": ["Mondeo", "Mustang", "Fiesta", "Focus"], "a": 1, "n": 17, "g": "Reading (4)", "p": "Automakers will race to appeal to budget-conscious Chinese car buyers as the industry expands beyond the wealthy coastal cities in the east, Ford Motor Co's (F.N) Asia chief said on Tuesday.\nAs they expand more heavily into central and western China, automakers can appeal to price-sensitive consumers by offering multiple vehicles within the same size segment at varying prices, Joe Hinrichs said.\n\"The growth expected the rest of this decade in China is largely to come from the central and western parts of the country which is more value-oriented,\" he told reporters at Ford's headquarters in Dearborn, Michigan.\n\"You'll need to serve those customers differently,\" he added.\nFord's plan to introduce 15 new vehicles in China by 2015 began with last month's launch of the new Focus. Hinrichs said last month in Beijing that Ford plans to sell cars priced below the Fiesta, currently their cheapest model in Asia with a price ranging from $12,300 to $17,500.\nFord sales in China rose 24 percent in April to 54,881 vehicles, spurred by strong demand for the Focus.\nFord makes the Fiesta, Focus, Mondeo and other vehicles in China in a three-way tie-up with Chongqing Automobile Co., Ltd. 000625.SZ and Japan's Mazda Motor Corp (7261.T).\nAFP 04/25/2012"}, {"q": "How many other companies does Ford partner with to make cars in China?", "o": ["One", "Two", "Three", "Four"], "a": 2, "n": 18, "g": "Reading (4)", "p": "Automakers will race to appeal to budget-conscious Chinese car buyers as the industry expands beyond the wealthy coastal cities in the east, Ford Motor Co's (F.N) Asia chief said on Tuesday.\nAs they expand more heavily into central and western China, ticle, which one is going to happen?", "o": ["Smart tags will increase sales of consumer goods.", "The cost of smart tags will run into tens of billions of dollars.", "Supermarket staff will be alerted when goods are stolen.", "People do not need to go to the supermarket anymore."], "a": 2, "n": 21, "g": "Reading (5)", "p": "Smart labels may be about to change the way that companies distribute and sell almost everything they make. \nThe reason for this situation is a new, better version of an old tracking technology called Radio Frequency Identification (RFID). RFID systems are made up of readers and \"smart tags\" - microchips attached to antennas. When the tag nears a reader, it broadcasts the information contained in its chip. In the past four years, the cost of the cheapest tags has plunged from $2 to 20 cents. In the next two to three years, prices are likely to fall to five cents or less. Gillette announced that the company had created a new type of smart tags and had put in an order for half a billion smart tags, signaling the start of their adoption by the consumer goods industry. If they catch on, smart tags will soon be made in their trillions and will replace the barcode on the packaging of almost everything. \nGillette is piloting two uses for its tags. The first combines smart tags with \"smart shelves\", which are fitted with tag readers. Gillette says that retailers and consumer goods firms in the USA lose around $30 billion a year in sales because shop shelves run out of products and stand empty. On Gillette's smart shelves, the tagged razors let the shelf know when they are coming and going, and the shelf keeps count. If it gets too empty, the shelf sends a message to store staff to say it needs to be filled. \nGillette is also piloting the use of smart tags to track products as they move from factory to supermarket. Smart tags can be scanned automatically. As a result, shipment errors and theft will be reduced. Because manufacturers can be certain start of their adoption by the consumer goods industry. If they catch on, smart tags will soon be made in their trillions and will replace the barcode on the packaging of almost everything. \nGillette is piloting two uses for its tags. The first combines smart tags with \"smart shelves\", which are fitted with tag readers. Gillette says that retailers and consumer goods firms in the USA lose around $30 billion a year in sales because shop shelves run out of products and stand empty. On Gillette's smart shelves, the tagged razors let the shelf know when they are coming and going, and the shelf keeps count. If it gets too empty, the shelf sends a message to store staff to say it needs to be filled. \nGillette is also piloting the use of smart tags to track products as they move from factory to supermarket. Smart tags can be scanned automatically. As a result, shipment errors and theft will be reduced. Because manufacturers can be certain that they are shipping the right quantity of goods to the right place at the right time, they can also afford to reduce the inventories. \nThe biggest worry is that consumers might reject smart tags because they seem too invasive of their privacy. Its chip specifications include a \"kill command\" that gives the customers the option to kill tags at the checkout. However, if using this command, the customers would miss after-sales benefits such as better warranty and returned goods services.\nIntelligent Business Pre-Intermediate Coursebook"}, {"q": "Using smart tags to monitor products will ________.", "o": ["reduce the number of mistakes usually made", "increase the quantities of goods shipped", "increase the number of inventories", "increase the inventories"], "a": 0, "n": 24, "g": "Reading (5)", "p": "Smart labels may be about to change the way that companies distribute and sell almost everything they make. \nThe reason for this situation is a new, better version of an old tracking technology called Radio Frequency Identification ( t place at the right time, they can also afford to reduce the inventories. \nThe biggest worry is that consumers might reject smart tags because they seem too invasive of their privacy. Its chip specifications include a \"kill command\" that gives the customers the option to kill tags at the checkout. However, if using this command, the customers would miss after-sales benefits such as better warranty and returned goods services.\nIntelligent Business Pre-Intermediate Coursebook"}, {"q": "What happened to Starbucks' shares after their quarterly profits failed to meet analysts' estimates?", "o": ["They dropped by 5%.", "They plunged by 5%.", "They rose by 10%.", "They decreased by 10%."], "a": 1, "n": 26, "g": "Reading (6)", "p": "Starbucks was founded by Jerry Baldwin, Gordon Bowker, and Zev Siegl, opening its first store in 1971 in Seattle. The three Starbucks founders had two things in common; they were all coming from academia, and they all loved coffee and tea. They invested and borrowed some money to open the first store in Seattle and named it “Starbucks” after the first mate in Herman Melville’s classic novel Moby Dick.\nLast year, Starbucks Corp. reported better-than-expected quarterly profit but global sales at established coffee shops fell short of analysts' estimates due to weakness in Europe, sending its shares down five percent in after-hours trade on Thursday.\nSales from cafes open at least 13 months fell 1 percent in the Europe, the Middle East and Africa (EMEA) region during the latest quarter. Analysts polled by Consensus Metrix had expected a 2.2 percent rise in EMEA same-store sales.\nExecutives attributed the drop to weakness in Europe, which suffered its first decline in same-store sales since 2009.\nSales fell in Ireland and Germany during the fiscal second quarter and were up just slightly in France, the Netherlands, and the United Kingdom, Starbucks Chief Financial Officer Troy Alstead said.\nEurope has been a weak spot for the world's bigge y, very tough,\" Chief Executive Howard Schultz said of Europe's economy.\n\"We will turn the Europe business around in the same way we turned the U.S. business around,\" Schultz told analysts on a conference call."}, {"q": "According to the article, in which European countries did Starbucks' NOT see a slight increase in sales?", "o": ["The United Kingdom", "Ireland", "France", "Holland"], "a": 1, "n": 28, "g": "Reading (6)", "p": "Starbucks was founded by Jerry Baldwin, Gordon Bowker, and Zev Siegl, opening its first store in 1971 in Seattle. The three Starbucks founders had two things in common; they were all coming from academia, and they all loved coffee and tea. They invested and borrowed some money to open the first store in Seattle and named it “Starbucks” after the first mate in Herman Melville’s classic novel Moby Dick.\nLast year, Starbucks Corp. reported better-than-expected quarterly profit but global sales at established coffee shops fell short of analysts' estimates due to weakness in Europe, sending its shares down five percent in after-hours trade on Thursday.\nSales from cafes open at least 13 months fell 1 percent in the Europe, the Middle East and Africa (EMEA) region during the latest quarter. Analysts polled by Consensus Metrix had expected a 2.2 percent rise in EMEA same-store sales.\nExecutives attributed the drop to weakness in Europe, which suffered its first decline in same-store sales since 2009.\nSales fell in Ireland and Germany during the fiscal second quarter and were up just slightly in France, the Netherlands, and the United Kingdom, Starbucks Chief Financial Officer Troy Alstead said.\nEurope has been a weak spot for the world's biggest coffee chain. The region is struggling with debts and, earlier this week, Britain said its economy had fallen into its second recession since the financial crisis.\n\"The situation is very, very tough,\" Chief Executive Howard Schultz said of Europe's economy.\n\"We will turn the Europe business arou ness around,\" Schultz told analysts on a conference call."}, {"q": "What can be inferred about Starbucks?", "o": ["It was the first time Starbucks experienced this situation.", "The CEO of Starbucks was pessimistic about the issue.", "Starbucks has always struggled in Europe.", "The situation could be handled in a short time."], "a": 2, "n": 30, "g": "Reading (6)", "p": "Starbucks was founded by Jerry Baldwin, Gordon Bowker, and Zev Siegl, opening its first store in 1971 in Seattle. The three Starbucks founders had two things in common; they were all coming from academia, and they all loved coffee and tea. They invested and borrowed some money to open the first store in Seattle and named it “Starbucks” after the first mate in Herman Melville’s classic novel Moby Dick.\nLast year, Starbucks Corp. reported better-than-expected quarterly profit but global sales at established coffee shops fell short of analysts' estimates due to weakness in Europe, sending its shares down five percent in after-hours trade on Thursday.\nSales from cafes open at least 13 months fell 1 percent in the Europe, the Middle East and Africa (EMEA) region during the latest quarter. Analysts polled by Consensus Metrix had expected a 2.2 percent rise in EMEA same-store sales.\nExecutives attributed the drop to weakness in Europe, which suffered its first decline in same-store sales since 2009.\nSales fell in Ireland and Germany during the fiscal second quarter and were up just slightly in France, the Netherlands, and the United Kingdom, Starbucks Chief Financial Officer Troy Alstead said.\nEurope has been a weak spot for the world's biggest coffee chain. The region is struggling with debts and, earlier this week, Britain said its economy had fallen into its second recession since the financial crisis.\n\"The situation is very, very tough,\" Chief Executive Howard Schultz said of Europe's economy.\n\"We will turn the Europe business around in the same way we turned the U.S. business around,\" Schultz told analysts on a conference call."}, {"q": "According to the article, the growth in consumer credit in March was _______ economists had predicted", "o": ["about the same as", "slightly lower than", "twice as much as", "much higher than"], "a": 2, "n": 31, "g": "Reading (7)", "p": "Consumers went back to using their credit cards in March, 2012 to keep spending while student and new-car loans shot up as the value of outstanding consumer credit jumped at the fastest rate since late 2001, data from the Federal Reserve showed on Monday.\nTotal consumer credit grew by $21.36 billion - about twice the $9.8 billion rise that Wall Street economists surveyed by Reuters had forecast. That followed a revised $9.27 billion increase in outstanding credit in February.\nAnalysts expressed some reservations whether the date reliably signaled a real pickup in demand, something that would normally fuel stronger growth, or just a need to rely more on credit in a shrinking economy generating “anemic” job growth.\n\"The optimistic read is that consumers' improved outlook on the economy and employment prospects led them to feel comfortable spending on credit, while a more downbeat interpretation is that credit is needed for consumers to keep up,\" Nomura Global Economics said in a note afterward.\nThe March rise in consumer credit was the strongest for any month since November 2001 when it soared by $28 billion. That was shortly after the September 11, 2001 attacks when big automakers were offering zero-percent financing and other incentives to lure consumers back to their showrooms.\nNew-car sales and production were a key influence on the 2.2 percent annual rate of economic growth posted during the first three months this year. The government estimated that about half of that growth came from increased new car production.\nAFP 05/14/2012."}, {"q": "By using the word \"anemic\", the article wants to say that the current job growth numbers are ________.", "o": ["excellent", "average", "poor", "impressive"], "a": 2, "n": 32, "g": "Reading (7)", "p": "Consumers went back to using their credit cards in March, 2012 to keep spending while student and new-car loans shot up as the value of outstanding consumer credit jumped at the fastest rate since late 2001, data from the Federal Reserve showed on Monday.\nTotal consumer credit grew by $21.36 billion - about twice the $9.8 billion rise that Wall Street economists surveyed by Reuters had forecast. That followed a revised $9.27 billion increase in outstanding credit in February.\nAnalysts expressed some reservations whether the date reliably signaled a real pickup in demand, something that would normally fuel stronger growth, or just a need to rely more on credit in a shrinking economy generating “anemic” job growth.\n\"The optimistic read is that consumers' improved outlook on the economy and employment prospects led them to feel comfortable spending on credit, while a more downbeat interpretation is that credit is needed for consumers to keep up,\" Nomura Global Economics said in a note afterward.\nThe March rise in consumer credit was the strongest for any month since November 2001 when it soared by $28 billion. That was shortly after the September 11, 2001 attacks when big automakers were offering zero-percent financing and other incentives to lure consumers back to their showrooms.\nNew-car sales and production were a key influence on the 2.2 percent annual rate of economic growth posted during the first three months this year. The government estimated that about half of that growth came from increased new car production.\nAFP 05/14/2012."}, {"q": "According to the article, does the increase in consumer credit mean that the economy is improving?", "o": ["Not necessarily.", "Yes, most of the time.", "No, just the opposite", "Absolutely."], "a": 0, "n": 33, "g": "Reading (7)", "p": "Consumers went back to using their credit cards in March, 2012 to keep spending while student and new-car loans shot up as the value of outstanding consumer credit jumped at the fastest rate since late 2001, data from the Federal Reserve showed on Monday.\nTotal consumer credit grew by $21.36 billion - about twice the $9.8 billion rise that Wall Street economists surveyed by Reuters had forecast. That followed a revised $9.27 billion increase in outstanding credit in February.\nAnalysts expressed some reservations whether the date reliably signaled a real pickup in demand, something that would normally fuel stronger growth, or just a need to rely more on credit in a shrinking economy generating “anemic” job growth.\n\"The optimistic read is that consumers' improved outlook on the economy and employment prospects led them to feel comfortable spending on credit, while a more downbeat interpretation is that credit is needed for consumers to keep up,\" Nomura Global Economics said in a note afterward.\nThe March rise in consumer credit was the strongest for any month since November 2001 when it soared by $28 billion. That was shortly after the September 11, 2001 attacks when big automakers were offering zero-percent financing and other incentives to lure consumers back to their showrooms.\nNew-car sales and production were a key influence on the 2.2 percent annual rate of economic growth posted during the first three months this year. The government estimated that about half of that growth came from increased new car production.\nAFP 05/14/2012."}, {"q": "How long had it been since the consumer credit numbers increased so much in one month?", "o": ["Half of a year", "A year", "Over 10 years", "About three years"], "a": 2, "n": 34, "g": "Reading (7)", "p": "Consumers went back to using their credit cards in March, 2012 to keep spending while student and new-car loans shot up as the value of outstanding consumer credit jumped at the fastest rate since late 2001, data from the Federal Reserve showed on Monday.\nTotal consumer credit grew by $21.36 billion - about twice the $9.8 billion rise that Wall Street economists surveyed by Reuters had forecast. That followed a revised $9.27 billion increase in outstanding credit in February.\nAnalysts expressed some reservations whether the date reliably signaled a real pickup in demand, something that would normally fuel stronger growth, or just a need to rely more on credit in a shrinking economy generating “anemic” job growth.\n\"The optimistic read is that consumers' improved outlook on the economy and employment prospects led them to feel comfortable spending on credit, while a more downbeat interpretation is that credit is needed for consumers to keep up,\" Nomura Global Economics said in a note afterward.\nThe March rise in consumer credit was the strongest for any month since November 2001 when it soared by $28 billion. That was shortly after the September 11, 2001 attacks when big automakers were offering zero-percent financing and other incentives to lure consumers back to their showrooms.\nNew-car sales and production were a key influence on the 2.2 percent annual rate of economic growth posted during the first three months this year. The government estimated that about half of that growth came from increased new car production.\nAFP 05/14/2012."}, {"q": "According to the article, what played an important part in the economic growth at the beginning of the year (2012)?", "o": ["A record-breaking drop in unemployment", "A decrease in tax rates", "New car production and sales", "Zero-percent financing"], "a": 2, "n": 35, "g": "Reading (7)", "p": "Consumers went back to using their credit cards in March, 2012 to keep spending while student and new-car loans shot up as the value of outstanding consumer credit jumped at the fastest rate since late 2001, data from the Federal Reserve showed on Monday.\nTotal consumer credit grew by $21.36 billion - about twice the $9.8 billion rise that Wall Street economists surveyed by Reuters had forecast. That followed a revised $9.27 billion increase in outstanding credit in February.\nAnalysts expressed some reservations whether the date reliably signaled a real pickup in demand, something that would normally fuel stronger growth, or just a need to rely more on credit in a shrinking economy generating “anemic” job growth.\n\"The optimistic read is that consumers' improved outlook on the economy and employment prospects led them to feel comfortable spending on credit, while a more downbeat interpretation is that credit is needed for consumers to keep up,\" Nomura Global Economics said in a note afterward.\nThe March rise in consumer credit was the strongest for any month since November 2001 when it soared by $28 billion. That was shortly after the September 11, 2001 attacks when big automakers were offering zero-percent financing and other incentives to lure consumers back to their showrooms.\nNew-car sales and production were a key influence on the 2.2 percent annual rate of economic growth posted during the first three months this year. The government estimated that about half of that growth came from increased new car production.\nAFP 05/14/2012."}, {"q": "In Peter Maurice’s opinion, what prevents many customers from making purchases?", "o": ["The shop is so big and huge.", "The shop hasn’t got what they want.", "Nobody is available to serve them.", "There is too much to choose from."], "a": 3, "n": 36, "g": "Reading (8)", "p": "Chief Executive of the Star City shopping center, Peter Maurice wants to change the whole feeling of the business. ‘Visitors should feel we are looking after them. Very often the public go into a shop and find so much there that they can’t decide what to buy. Keep it simple, that’s the key to retailing.’\nAt Star City, staff are encouraged to tell managers what they think of them. ‘The things they say about me are what I expect, because I’m fairly self-aware – I know what I’m like and that I can make people a little angry. But I’m very much in favor of change, and everyone knows that a lot needs to be done.’\nHe learned his management techniques the hard way. ‘At 23 I went into business and lost money. I had to learn fast. Then, at 23, I won an export contract to Hong Kong. I admire the strength of character and the ambition of the people there, and brought back two very significant words: “No problem”. Then I took a course at Harvard Business School. It was very hard work, but worth it.’\nAs well as running Star City, Peter Maurice controls Big Events, which organizes exhibitions. Maurice has created an unusual company structure. ‘The financial director and commercial director are responsible to me directly, but in my first week here, the head of Marketing resigned. Then the same happened with Human Resources. I said to both teams: “Do you want to self-manage?” That’s what they decided to do – it can work if you have people who work well together and can report to you as a team,’ he explains.\nFor the immediate future, Maurice plans to look at ways of expanding Star City beyond the present conferences and exhibitions, to include major shows and concerts. ‘I want a lively center full of exciting events, where my well-trained staff are ambassadors for the company.’"}, {"q": "Maurice’s staff say that he ________.", "o": ["should change a lot.", "sometimes annoys them.", "is trying to do too much too quickly.", "needs to be more self-aware."], "a": 1, "n": 37, "g": "Reading (8)", "p": "Chief Executive of the Star City shopping center, Peter Maurice wants to change the whole feeling of the business. ‘Visitors should feel we are looking after them. Very often the public go into a shop and find so much there that they can’t decide what to buy. Keep it simple, that’s the key to retailing.’\nAt Star City, staff are encouraged to tell managers what they think of them. ‘The things they say about me are what I expect, because I’m fairly self-aware – I know what I’m like and that I can make people a little angry. But I’m very much in favor of change, and everyone knows m like and that I can make people a little angry. But I’m very much in favor of change, and everyone knows that a lot needs to be done.’\nHe learned his management techniques the hard way. ‘At 23 I went into business and lost money. I had to learn fast. Then, at 23, I won an export contract to Hong Kong. I admire the strength of character and the ambition of the people there, and brought back two very significant words: “No problem”. Then I took a course at Harvard Business School. It was very hard work, but worth it.’\nAs well as running Star City, Peter Maurice controls Big Events, which organizes exhibitions. Maurice has created an unusual company structure. ‘The financial director and commercial director are responsible to me directly, but in my first week here, the head of Marketing resigned. Then the same happened with Human Resources. I said to both teams: “Do you want to self-manage?” That’s what they decided to do – it can work if you have people who work well together and can report to you as a team,’ he explains.\nFor the immediate future, Maurice plans to look at ways of expanding Star City beyond the present conferences and exhibitions, to include major shows and concerts. ‘I want a lively center full of exciting events, where my well-trained staff are ambassadors for the company.’"}, {"q": "Maurice’s long-term ambition for the center is to ________.", "o": ["create an unusual company structure", "retrain all the staff at the center", "modernize the center", "bring entertainment to the center"], "a": 3, "n": 40, "g": "Reading (8)", "p": "Chief Executive of the Star City shopping center, Peter Maurice wants to change the whole feeling of the business. ‘Visitors should feel we are looking after them. Very often the public go into a shop and find so much there that they can’t decide what to buy. Keep it simple, that’s the key to retailing.’\nAt Star City, staff are encouraged to tell managers what they think of them. ‘The things they say about me are what – men or women.\nSurveys have been carried out to find out why certain individuals become national leaders. If a person occupies the leading position in a country, there ought to be some common identifiable qualities. For example, some leaders had to be intelligent, and had great enthusiasm, courage, determination, energy, and faith. But possession of all these traits would be unusual in any one person. So, these are necessary, but not sufficient conditions; good leaders have these qualities, but their possession alone does not make a good leader.\nIn his book, Understanding Organizations, Professor Charles Handy claims there is not right style of leadership. He says that leadership will be most effective when the requirements of the leader, the subordinates and the task fit together. This would seem to rather exclude personality from the management position. Handy adds that managers need value systems which would acknowledge the desire for personal success, and the planning and control of the actions of the people below them in the company hierarchy.\nIn his later theories, he defines managers as people who are responsible for making things happen. Managers take responsibility for the actions of others. This is a popular modern definition of a manager, and while Handy accepts that personal characteristics, he has added further vital statistics which he calls the four Ps: Projects, Professionalism, Passion, and Pride."}, {"q": "What some qualities does the writer believe to make a successful national leader?", "o": ["People who are taller than other people.", "People who are intelligent and determined", "People who earn a lot of money", "People who come from good family background."], "a": 1, "n": 42, "g": "Reading (9)", "p": "The characteristics required by a good manager are clearly definable. The person has to be responsible, communicative, supportive, and approachable. These adjectives are not gender-based, and focus attention on interpersonal skills, but a fier cus attention on interpersonal skills, but a fierce debate still rages as to who make the best managers – men or women.\nSurveys have been carried out to find out why certain individuals become national leaders. If a person occupies the leading position in a country, there ought to be some common identifiable qualities. For example, some leaders had to be intelligent, and had great enthusiasm, courage, determination, energy, and faith. But possession of all these traits would be unusual in any one person. So, these are necessary, but not sufficient conditions; good leaders have these qualities, but their possession alone does not make a good leader.\nIn his book, Understanding Organizations, Professor Charles Handy claims there is not right style of leadership. He says that leadership will be most effective when the requirements of the leader, the subordinates and the task fit together. This would seem to rather exclude personality from the management position. Handy adds that managers need value systems which would acknowledge the desire for personal success, and the planning and control of the actions of the people below them in the company hierarchy.\nIn his later theories, he defines managers as people who are responsible for making things happen. Managers take responsibility for the actions of others. This is a popular modern definition of a manager, and while Handy accepts that personal characteristics, he has added further vital statistics which he calls the four Ps: Projects, Professionalism, Passion, and Pride."}, {"q": "The modern definition of a manager is ________.", "o": ["a person who is answerable to shareholders", "a person who is ambitious to achieve higher positions", "a person who takes charge of both subordinates and superiors.", "a person who effectively does everything on his own."], "a": 2, "n": 44, "g": "Reading (9)", "p": "The characteristics required by a good manager are clearly definable. The person has to be responsible, communicative, s g (10)", "p": "Michael Mann established the Independent Executive Service (IES) in the late eighties, a service which provides companies with temporary executives to help them out with particular tasks. The idea is simple. The skills that make a good businessperson who can launch a new business are quite different from those needed to run a medium-sized, mature operation, especially if the business gets into difficulties. It is in situations like this that the IES steps in.\nIt recruits people who have spent their careers in management, usually entrepreneurs. The prospect of spending a limited time in a wide range of businesses is attractive to these entrepreneurs. They want to do more in business, but don’t want to go through the start-up process themselves again. \n‘After preliminary discussions with the client company’s HR Manager, we introduce five or six candidates to their board of directors. They then select the IES executive who best fits their requirements’. ‘We provide independent directors to many troubled companies, including those that we have already provided venture capital for. The service is free to these existing clients. For a fee, we also help out other companies which we think have a good recovery potential. Additionally, we have a great deal of repeat business from satisfied customers who buy our services again to help with a later stage of expansion.’\nAccording to Mann, the first step for independent executives is often to establish how a business is meant to be run. ‘In many small businesses, it is often unclear to board members who are responsible for what in the company. Another common starting point is helping the existing management avoid bankruptcy. Only then is it possible to turn to more long-term issues."}, {"q": "What is the idea on which the IES is based?", "o": ["Some companies have too bad leaders to overcome the difficulties.", "Different market sectors require different kinds of business skills.", "Even skilled businesspeople need help in situations new to them.", "Specialized leadership skills are needed to achieve fast growth."], "a": 2, "n": 47, "g": "Reading (10)", "p": "Michael Mann established the Independent Executive Service (IES) in the late eighties, a service which provides companies with temporary executives to help them out with particular tasks. The idea is simple. The skills that make a good businessperson who can launch a new business are quite different from those needed to run a medium-sized, mature operation, especially if the business gets into difficulties. It is in situations like this that the IES steps in.\nIt recruits people who have spent their careers in management, usually entrepreneurs. The prospect of spending a limited time in a wide range of businesses is attractive to these entrepreneurs. They want to do more in business, but don’t want to go through the start-up process themselves again. \n‘After preliminary discussions with the client company’s HR Manager, we introduce five or six candidates to their board of directors. They then select the IES executive who best fits their requirements’. ‘We provide independent directors to many troubled companies, including those that we have already provided venture capital for. The service is free to these existing clients. For a fee, we also help out other companies which we think have a good recovery potential. Additionally, we have a great deal of repeat business from satisfied customers who buy our services again to help with a later stage of expansion.’\nAccording to Mann, the first step for independent executives is often to establish how a business is meant to be run. ‘In many small businesses, it is often unclear to board members who are responsible for what in the company. Another common starting point is helping the existing management avoid bankruptcy. Only then is it possible to turn to more long-term issues."}, {"q": "Why do many IES executives like working for companies for limited periods?", "o": ["The sting management avoid bankruptcy. Only then is it possible to turn to more long-term issues."}, {"q": "IES executives often work with directors who are ________.", "o": ["unable to make long-term strategies for the companies.", "unsure of their exact roles within their companies.", "unclear about the causes of their companies’ difficulties.", "unaware that their companies are close to bankruptcy."], "a": 2, "n": 50, "g": "Reading (10)", "p": "Michael Mann established the Independent Executive Service (IES) in the late eighties, a service which provides companies with temporary executives to help them out with particular tasks. The idea is simple. The skills that make a good businessperson who can launch a new business are quite different from those needed to run a medium-sized, mature operation, especially if the business gets into difficulties. It is in situations like this that the IES steps in.\nIt recruits people who have spent their careers in management, usually entrepreneurs. The prospect of spending a limited time in a wide range of businesses is attractive to these entrepreneurs. They want to do more in business, but don’t want to go through the start-up process themselves again. \n‘After preliminary discussions with the client company’s HR Manager, we introduce five or six candidates to their board of directors. They then select the IES executive who best fits their requirements’. ‘We provide independent directors to many troubled companies, including those that we have already provided venture capital for. The service is free to these existing clients. For a fee, we also help out other companies which we think have a good recovery potential. Additionally, we have a great deal of repeat business from satisfied customers who buy our services again to help with a later stage of expansion.’\nAccording to Mann, the first step for independent executives is often to establish how a business is meant to be run. ‘In many small businesses, it is often unclear to board members who are responsible for what in the company. Another common starting point is helping the existing management avoid bankruptcy. Only then is it possible to turn to more long-term issues."}, {"q": "The writer thinks that self-service is a good idea for ________.", "o": ["the phone company and the bank", "young customers only", "both customers and companies", "American entrepreneurs"], "a": 2, "n": 51, "g": "Reading (11)", "p": "You may not have noticed, but you are also now working for your phone company and your bank. Why? Because of the growth of the self-service economy in which companies do the work. Self-service can have benefits both for companies and customers. It is already changing business practices in many industries and seems likely to become even more widespread in future.\nSelf-service has been around for decades, ever since Clarence Saunders, an American entrepreneur, opened the first Piggly Wiggly supermarket in 1916 in Memphis, Tennessee. Shoppers entered the store, helped themselves to whatever they need and then carried their purchases to the check-out counter for payment. Previously, store clerks were responsible for getting items off the shelves; but with the arrival of the supermarket, the shoppers took on that job themselves.\nThen came laundromats, cafeterias, and self-service car washes, all of which were variations on the same theme. With the rise of the web, companies are taking self-service to new levels. Millions of people now manage their finances, track packages, and buy cinema and theater tickets while sitting in front of their computers. They plan their own travel itineraries and make their own hotel and airline bookings: later, at the airport, they may even check themselves in. And they do all of this with mouse in hand and no human employees in sight. Self-service systems can save companies money and make customers happy. This suggests that they could transform the service economy in much the same way that mass production transformed manufacturing, by allowing services to be delivered at low cost in large volumes. Though it may take five years before most transactions are conducted via self-service, we are definitely moving in that direction."}, {"q": "The first supermarket was set up ________.", "o": ["in 1900s.", "before 1920.", "in the 1950s.", "after 1975."], "a": 1, "n": 52, "g": "Reading (11)", "p": "You may not have noticed, but you are also now working for your phone company and your bank. Why? Because of the growth of the self-service economy in which companies do the work. Self-service can have benefits both for companies and customers. It is already changing business practices in many industries and seems likely to become even more widespread in future.\nSelf-service has been around for decades, ever since Clarence Saunders, an American entrepreneur, opened the first Piggly Wiggly supermarket in 1916 in Memphis, Tennessee. Shoppers entered the store, helped themselves to whatever they need and then carried their purchases to the check-out counter for payment. Previously, store clerks were responsible for getting items off the shelves; but with the arrival of the supermarket, the shoppers took on that job themselves.\nThen came laundromats, cafeterias, and self-service car washes, all of which were variations on the same theme. With the rise of the web, companies are taking self-service to new levels. Millions of people now manage their finances, track packages, and buy cinema and theater tickets while sitting in front of their computers. They plan their own travel itineraries and make their own hotel and airline bookings: later, at the airport, they may even check themselves in. And they do all of this with mouse in hand and no human employees in sight. Self-service systems can save companies money and make customers happy. This suggests that they could transform the service economy in much the same way that mass production transformed manufacturing, by allowing services to be delivered at low cost in large volumes. Though it may take five years before most transactions are conducted via self-service, we are definitely moving in that direction."}, {"q": "The store clerk’s main job was to ________.", "o": ["carry customers’ purchases", "check items on the shelves", "give customers the goods they wanted", "open the supermarket"], "a": 2, "n": 53, "g": "Reading (11)", "p": "You may not have noticed, but you are also now working for your phone company and your bank. Why? Because of the growth of the self-service economy in which companies do the work. Self-service can have benefits both for companies and customers. It is already changing business practices in many industries and seems likely to become even more widespread in future.\nSelf-service has been around for decades, ever since Clarence Saunders, an American entrepreneur, opened the first Piggly Wiggly supermarket in 1916 in Memphis, Tennessee. Shoppers entered the store, helped themselves to whatever they need and then carried their purchases to the check-out counter for payment. Previously, store clerks were responsible for getting items off the shelves; but with the arrival of the supermarket, the shoppers took on that job themselves.\nThen came laundromats, cafeterias, and self-service car washes, all of which were variations on the same theme. With the rise of the web, companies are taking self-service to new levels. Millions of people now manage their finances, track packages, and buy cinema and theater tickets while sitting in front of their computers. They plan their own travel itineraries and make their own hotel and airline bookings: later, at the airport, they may even check themselves in. And they do all of this with mouse in hand and no human employees in sight. Self-service systems can save companies money and make customers happy. This suggests that they could transform the service economy in much the same way that mass production transformed manufacturing, by allowing services to be delivered at low cost in large volumes. Though it may take five years before most transactions are conducted via self-service, we are definitely moving in that direction."}, {"q": "Modern self-service is increasing because people ________.", "o": ["do not want to do physical activities.", "don’t want to work with employees.", "are using cafeterias and laundromats.", "are using the internet a lot."], "a": 3, "n": 54, "g": "Reading (11)", "p": "You may not have noticed, but you are also now working for your phone company and your bank. Why? Because of the growth of the self-service economy in which companies do the work. Self-service can have benefits both for companies and customers. It is already changing business practices in many industries and seems likely to become even more widespread in future.\nSelf-service has been around for decades, ever since Clarence Saunders, an American entrepreneur, opened the first Piggly Wiggly supermarket in 1916 in Memphis, Tennessee. Shoppers entered the store, helped themselves to whatever they need and then carried their purchases to the check-out counter for payment. Previously, store clerks were responsible for getting items off the shelves; but with the arrival of the supermarket, the shoppers took on that job themselves.\nThen came laundromats, cafeterias, and self-service car washes, all of which were variations on the same theme. With the rise of the web, companies are taking self-service to new levels. Millions of people now manage their finances, track packages, and buy cinema and theater tickets while sitting in front of their computers. They plan their own travel itineraries and make their own hotel and airline bookings: later, at the airport, they may even check themselves in. And they do all of this with mouse in hand and no human employees in sight. Self-service systems can save companies money and make customers happy. This suggests that they could transform the service economy in much the same way that mass production transformed manufacturing, by allowing services to be delivered at low cost in large volumes. Though it may take five years before most transactions are conducted via self-service, we are definitely moving in that direction."}, {"q": "According to the passage, mass production changed ________.", "o": ["the airline industry", "the retail industry.", "the service industry.", "the manufacturing industries."], "a": 3, "n": 55, "g": "Reading (11)", "p": "You may not have noticed, but you are also now working for your phone company and your bank. Why? Because of the growth of the self-service economy in which companies do the work. Self-service can have benefits both for companies and customers. It is already changing business practices in many industries and seems likely to become even more widespread in future.\nSelf-service has been around for decades, ever since Clarence Saunders, an American entrepreneur, opened the first Piggly Wiggly supermarket in 1916 in Memphis, Tennessee. Shoppers entered the store, helped themselves to whatever they need and then carried their purchases to the check-out counter for payment. Previously, store clerks were responsible for getting items off the shelves; but with the arrival of the supermarket, the shoppers took on that job themselves.\nThen came laundromats, cafeterias, and self-service car washes, all of which were variations on the same theme. With the rise of the web, companies are taking self-service to new levels. Millions of people now manage their finances, track packages, and buy cinema and theater tickets while sitting in front of their computers. They plan their own travel itineraries and make their own hotel and airline bookings: later, at the airport, they may even check themselves in. And they do all of this with mouse in hand and no human employees in sight. Self-service systems can save companies money and make customers happy. This suggests that they could transform the service economy in much the same way that mass production transformed manufacturing, by allowing services to be delivered at low cost in large volumes. Though it may take five years before most transactions are conducted via self-service, we are definitely moving in that direction."}, {"q": "Why has Contrast sold shares to King Coffee?", "o": ["To find new company’s brand to attract customers.", "To fund expansion abroad.", "To learn how to move into foreign markets.", "To use the King Coffee name in other countries."], "a": 2, "n": 56, "g": "Reading (12)", "p": "33% of the shares in the British sandwich chain Contrast were recently sold to King Coffee, the international coffee shop chain. According to Caroline Bell, Contrast’s Chairman, ‘This way, we’ll benefit from King Coffee’s experience to expand overseas, while keeping the two companies’ brands and branches quite separate.’ \nCaroline Bell and Johnny Nash set up a clothes shop ten years ago. Later, they began selling sandwiches there, and when they found sandwiches more profitable, they gave up selling clothes. During this time, Bell has been involved in every aspect of the business including sandwich making, while Johnny Nash is the Chief Executive.\nWith Nash responsible for day-to-day management, Bell can find time to concentrate on experimenting with different ingredients to add to the menu. ‘We believe in doing what we do best,’ she says, ‘so we don’t move into other fields. And our customers like our friendly service, so we’ll make sure that doesn’t change.’ \nOne reason for the friendly service is that five times a year, the managers spend a day at another branch serving customers, so that they don’t forget what it’s like for the sales staff. The company see their staff as key, and Bell is proud that most managerial appointments come from within the chain. ‘In fact we’ve done so well that there’s a risk we’ll stop trying, which would ruin Contrast.’", "e": "⚠️ File Word tô \"To use the King Coffee name\". Đoạn văn: Contrast hưởng lợi từ <i>kinh nghiệm của King Coffee để mở rộng ra nước ngoài<\/i> → <b>To learn how to move into foreign markets<\/b>."}, {"q": "How did Caroline Bell begin working for Contrast?", "o": ["She was one of the employees of the company.", "She was one of the people who founded the company.", "She joined the company as a sandwich maker.", "She was appointed at senior managerial level."], "a": 1, "n": 57, "g": "Reading (12)", "p": "33% of the shares in the British sandwich chain Contrast were recently sold to King Coffee, the international coffee shop chain. According to Caroline Bell, Contrast’s Chairman, ‘This way, we’ll benefit from King Coffee’s experience to expand overseas, while keeping the two companies’ brands and branches quite separate.’ \nCaroline Bell and Johnny Nash set up a clothes shop ten years ago. Later, they began selling sandwiches there, and when they found sandwiches more profitable, they gave up selling clothes. During this time, Bell has been involved in every aspect of the business including sandwich making, while Johnny Nash is the Chief Executive.\nWith Nash responsible for day-to-day management, Bell can find time to concentrate on experimenting with different ingredients to add to the menu. ‘We believe in doing what we do best,’ she says, ‘so we don’t move into other fields. And our customers like our friendly service, so we’ll make sure that doesn’t change.’ \nOne reason for the friendly service is that five times a year, the managers spend a day at another branch serving customers, so that they don’t forget what it’s like for the sales staff. The company see their staff as key, and Bell is proud that most managerial appointments come from within the chain. ‘In fact we’ve done so well that there’s a risk we’ll stop trying, which would ruin Contrast.’"}, {"q": "Bell’s plan for the company is to ________.", "o": ["improve the company’s day-to-day management", "expand the range of sandwiches on offer", "introduce new types of production methods", "improve the quality of the ingredients they use"], "a": 1, "n": 58, "g": "Reading (12)", "p": "33% of the shares in the British sandwich chain Contrast were recently sold to King Coffee, the international coffee shop chain. According to Caroline Bell, Contrast’s Chairman, ‘This way, we’ll benefit from King Coffee’s experience to expand overseas, while keeping the two companies’ brands and branches quite separate.’ \nCaroline Bell and Johnny Nash set up a clothes shop ten years ago. Later, they began selling sandwiches there, and when they found sandwiches more profitable, they gave up selling clothes. During this time, Bell has been involved in every aspect of the business including sandwich making, while Johnny Nash is the Chief Executive.\nWith Nash responsible for day-to-day management, Bell can find time to concentrate on experimenting with different ingredients to add to the menu. ‘We believe in doing what we do best,’ she says, ‘so we don’t move into other fields. And our customers like our friendly service, so we’ll make sure that doesn’t change.’ \nOne reason for the friendly service is that five times a year, the managers spend a day at another branch serving customers, so that they don’t forget what it’s like for the sales staff. The company see their staff as key, and Bell is proud that most managerial appointments come from within the chain. ‘In fact we’ve done so well that there’s a risk we’ll stop trying, which would ruin Contrast.’"}, {"q": "What happens on five days a year?", "o": ["They change the menu and cooking styles.", "Customers have the chance to talk to managers.", "Managers go to a different shop to work.", "All employees work in another shop."], "a": 2, "n": 59, "g": "Reading (12)", "p": "33% of the shares in the British sandwich chain Contrast were recently sold to King Coffee, the international coffee shop chain. According to Caroline Bell, Contrast’s Chairman, ‘This way, we’ll benefit from King Coffee’s experience to expand overseas, while keeping the two companies’ brands and branches quite separate.’ \nCaroline Bell and Johnny Nash set up a clothes shop ten years ago. Later, they began selling sandwiches there, and when they found sandwiches more profitable, they gave up selling clothes. During this time, Bell has been involved in every aspect of the business including sandwich making, while Johnny Nash is the Chief Executive.\nWith Nash responsible for day-to-day management, Bell can find time to concentrate on experimenting with different ingredients to add to the menu. ‘We believe in doing what we do best,’ she says, ‘so we don’t move into other fields. And our customers like our friendly service, so we’ll make sure that doesn’t change.’ \nOne reason for the friendly service is that five times a year, the managers spend a day at another branch serving customers, so that they don’t forget what it’s like for the sales staff. The company see their staff as key, and Bell is proud that most managerial appointments come from within the chain. ‘In fact we’ve done so well that there’s a risk we’ll stop trying, which would ruin Contrast.’"}, {"q": "What does Bell consider to be the biggest danger to the company?", "o": ["She lost the respect of colleagues.", "Most of the managers were promoted internally.", "Sandwich shops are going out of fashion.", "The management might relax their efforts."], "a": 3, "n": 60, "g": "Reading (12)", "p": "33% of the shares in the British sandwich chain Contrast were recently sold to King Coffee, the international coffee shop chain. According to Caroline Bell, Contrast’s Chairman, ‘This way, we’ll benefit from King Coffee’s experience to expand overseas, while keeping the two companies’ brands and branches quite separate.’ \nCaroline Bell and Johnny Nash set up a clothes shop ten years ago. Later, they began selling sandwiches there, and when they found sandwiches more profitable, they gave up selling clothes. During this time, Bell has been involved  changed GE by giving priority to organic growth and marketing superiority.\nMaking the company more global has been a key part of Mr. Immelt’s strategy. During his leadership, GE has become a multinational that earns half of its $150bn revenues from outside the country in 2010. But Mr. Immelt maintains that the US, where GE still employs 160,000 of its 316,000 employees, remains the ideal place to manufacture complex equipment. America, he believes, still produces top professionals.\nBut the bottom line is clear: without the benefit of buying and selling products around the world and employing skilled people from other countries, the 128-year-old company would be smaller than it is today.\nMr. Immelt set ambitious goals – a 10-per-cent annual growth in profits and an 8-per-cent increase in sales growth. Few companies in this country have grown so fast year after year, and none as big as GE."}, {"q": "Jack Welch’s main policy was ________.", "o": ["to change the company’s production methods", "to make the company more global.", "to compete with companies in Asia.", "to reduce expenses and make more profit."], "a": 3, "n": 62, "g": "Reading (13)", "p": "General Electric’s (GE) former leader, Jack Welch, was more typical of the imperial CEOs who wanted to control everything and made everyone totally obedient to him. Admired by analysts and feared by subordinates, Mr Welch ran GE with an aggression that helped to drive the company’s earnings to the maximum.\nBut Mr. Immelt created a quiet revolution in the company when he replaced Welch in 2001, bringing in a new approach to leadership.\nUnder Mr. Immelt, GE was a productivity machine where cutting costs and building value was the priority. When Mr. Immelt took over, GE needed to find a new way to cope with growing Asian competition and increasingly global markets. He changed GE by giving priority to organic growth and marketing superiority.\nMaking the company more global has been a key part of Mr. Immelt’s strategy.
