 as he fails to clean any rooms to the company's required standards. At the end of the program, we see his supervisor taking him from room to room, pointing out his mistakes.\nAlex Jennings runs a successful chain of steak bars called Wayside Inn. He has a reputation for demanding quality from his staff, both in terms of food and service. When he changes places with some of his staff, we see him fail a number of tasks in the restaurant. As a waiter, he continually forgets to ask customers how they want their steaks to be done and mixes up the orders completely when he has to serve five tables at the same time. A few minutes later, disaster strikes when his tie becomes caught under the drinks on a tray! The next day, when he takes the place of the cook, his supervisor makes him redo several of the steaks."}, {"q": "Alex Jennings has good skills as a waiter.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 60, "g": "Reading (32)", "p": "Many critics dislike reality TV but one show which has received very favorable reviews is Changing Places. The main idea is simple. Take the Chief Executive Officer of a company and put him or her in the position of one of the company's low-end workers.\nDonald Eisner is the CEO of the Absalon chain of hotels in Australia. His family have been hotel owners for three generations and are one of the wealthiest in the Australian hotel industry. In the program, we see Donald Eisner working as a bellboy, cook and cleaner while supervisors monitor his performance, noting any mistakes. He has some triumphs, it is true. In the kitchen, he successfully cooks several pancakes, for example, and, as a housekeeper, he makes the beds correctly. The rest of his housekeeping, however, is not a success, as he fails to clean any rooms to the company's required standards. At the end of the program, we see his supervisor taking him from room to room, pointing out his mistakes.\nAlex Jennings runs a successful chain of steak bars called Wayside Inn. He has a reputation for demanding quality from his staff, both in terms of food and service. When he changes places with some of his staff, we see him fail a number of tasks in the restaurant. As a waiter, he continually forgets to ask customers how they want their steaks to be done and mixes up the orders completely when he has to serve five tables at the same time. A few minutes later, disaster strikes when his tie becomes caught under the drinks on a tray! The next day, when he takes the place of the cook, his supervisor makes him redo several of the steaks."}, {"q": "Modern descriptions of manufacturing are the same as traditional description.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 61, "g": "Reading (33)", "p": "The old definitions of manufacturing are no longer worth much. One dictionary calls it ‘the making of an article by physical labor or machinery’. Now go and stand in a queue at a McDonald’s takeaway. Observe what goes on behind the counter. Gills cook raw discs of minced beef. Some workers are tending the grills; others are loading potato chips into vats of hot fat; yet others are taking orders, packing the output of their colleagues into cardboard cartons, adding whatever extras the customer calls for. Would you call this a service activity – or the distributed manufacture of cooked-meat products? The repetition of different tasks, the loading and unloading of the cooking machines, is very similar to a car assembly line.\nAlex Trotman, the chairman of Ford, sent a taskforce to McDonald’s when he set out to transform the car company years ago, to learn how McDonald’s turn out the same burgers all around the world. Ford wanted to do the same sort of thing. It wanted to change itself from a collection of regional company into one which designed and produced cars on a global basis, with a global supply chain.\nMr Trotman has long believed that in future a car company will beat its rivals not so much by the shape of the car it sells, or the power of its engine, as by what the company can do for its customers while they own the car. In the new meaning introduced by the new technologies, much of what used to be called ‘service work’ is becoming part of the same thing as what used to be called ‘manufacturing’."}, {"q": "At McDonald’s, workers have special training in the production of the food.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 62, "g": "Reading (33)", "p": "The old definitions of manufacturing are no longer worth much. One dictionary calls it ‘the making of an article by physical labor or machinery’. Now go and stand in a queue at a McDonald’s takeaway. Observe what goes on behind the counter. Gills cook raw discs of minced beef. Some workers are tending the grills; others are loading potato chips into vats of hot fat; yet others are taking orders, packing the output of their colleagues into cardboard cartons, adding whatever extras the customer calls for. Would you call this a service activity – or the distributed manufacture of cooked-meat products? The repetition of different tasks, the loading and unloading of the cooking machines, is very similar to a car assembly line.\nAlex Trotman, the chairman of Ford, sent a taskforce to McDonald’s when he set out to transform the car company years ago, to learn how McDonald’s turn out the same burgers all around the world. Ford wanted to do the same sort of thing. It wanted to change itself from a collection of regional company into one which designed and produced cars on a global basis, with a global supply chain.\nMr Trotman has long believed that in future a car company will beat its rivals not so much by the shape of the car it sells, or the power of its engine, as by what the company can do for its customers while they own the car. In the new meaning introduced by the new technologies, much of what used to be called ‘service work’ is becoming part of the same thing as what used to be called ‘manufacturing’."}, {"q": "Ford wanted to be less regional and more global.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 63, "g": "Reading (33)", "p": "The old definitions of manufacturing are no longer worth much. One dictionary calls it ‘the making of an article by physical labor or machinery’. Now go and stand in a queue at a McDonald’s takeaway. Observe what goes on behind the counter. Gills cook raw discs of minced beef. Some workers are tending the grills; others are loading potato chips into vats of hot fat; yet others are taking orders, packing the output of their colleagues into cardboard cartons, adding whatever extras the customer calls for. Would you call this a service activity – or the distributed manufacture of cooked-meat products? The repetition of different tasks, the loading and unloading of the cooking machines, is very similar to a car assembly line.\nAlex Trotman, the chairman of Ford, sent a taskforce to McDonald’s when he set out to transform the car company years ago, to learn how McDonald’s turn out the same burgers all around the world. Ford wanted to do the same sort of thing. It wanted to change itself from a collection of regional company into one which designed and produced cars on a global basis, with a global supply chain.\nMr Trotman has long believed that in future a car company will beat its rivals not so much by the shape of the car it sells, or the power of its engine, as by what the company can do for its customers while they own the car. In the new meaning introduced by the new technologies, much of what used to be called ‘service work’ is becoming part of the same thing as what used to be called ‘manufacturing’."}, {"q": "The future of the car industry will depend on the power of the engines.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 64, "g": "Reading (33)", "p": "The old definitions of manufacturing are no longer worth much. One dictionary calls it ‘the making of an article by physical labor or machinery’. Now go and stand in a queue at a McDonald’s takeaway. Observe what goes on behind the counter. Gills cook raw discs of minced beef. Some workers are tending the grills; others are loading potato chips into vats of hot fat; yet others are taking orders, packing the output of their colleagues into cardboard cartons, adding whatever extras the customer calls for. Would you call this a service activity – or the distributed manufacture of cooked-meat products? The repetition of different tasks, the loading and unloading of the cooking machines, is very similar to a car assembly line.\nAlex Trotman, the chairman of Ford, sent a taskforce to McDonald’s when he set out to transform the car company years ago, to learn how McDonald’s turn out the same burgers all around the world. Ford wanted to do the same sort of thing. It wanted to change itself from a collection of regional company into one which designed and produced cars on a global basis, with a global supply chain.\nMr Trotman has long believed that in future a car company will beat its rivals not so much by the shape of the car it sells, or the power of its engine, as by what the company can do for its customers while they own the car. In the new meaning introduced by the new technologies, much of what used to be called ‘service work’ is becoming part of the same thing as what used to be called ‘manufacturing’."}, {"q": "Service and manufacturing industries are becoming more similar.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 65, "g": "Reading (33)", "p": "The old definitions of manufacturing are no longer worth much. One dictionary calls it ‘the making of an article by physical labor or machinery’. Now go and stand in a queue at a McDonald’s takeaway. Observe what goes on behind the counter. Gills cook raw discs of minced beef. Some workers are tending the grills; others are loading potato chips into vats of hot fat; yet others are taking orders, packing the output of their colleagues into cardboard cartons, adding whatever extras the customer calls for. Would you call this a service activity – or the distributed manufacture of cooked-meat products? The repetition of different tasks, the loading and unloading of the cooking machines, is very similar to a car assembly line.\nAlex Trotman, the chairman of Ford, sent a taskforce to McDonald’s when he set out to transform the car company years ago, to learn how McDonald’s turn out the same burgers all around the world. Ford wanted to do the same sort of thing. It wanted to change itself from a collection of regional company into one which designed and produced cars on a global basis, with a global supply chain.\nMr Trotman has long believed that in future a car company will beat its rivals not so much by the shape of the car it sells, or the power of its engine, as by what the company can do for its customers while they own the car. In the new meaning introduced by the new technologies, much of what used to be called ‘service work’ is becoming part of the same thing as what used to be called ‘manufacturing’."}, {"q": "Eddie Bauer has changed the way that staff performance is rewarded.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 66, "g": "Reading (34)", "p": "Companies frequently combine several different schemes to reward different kinds of achievement. Eddie Bauer, a clothing retailer, used to pay people mainly by the kind of job they did, not by how they did it. \"People knew they could change their pay by rewriting their job description, not by raising their productivity\", says Lori Fosnes, the senior compensation manager. But now staff can win more pay by being promoted - sideways as well as upwards, as long as they acquire new skills in the process - or by improving their personal performance. \nHowever, the company reinforces the message with something that makes it easier to reward teamwork: with prizes for good behavior. The most basic is a star, about four inches across, which can be stuck on a filing cabinet or a wall. It can be given by any \"associate\", as Bauer people call each other, to any other at any time, in recognition for doing something well. The Oscar of Bauer awards is the \"Best of Bauer\", decided by a \"legends\" committee and handed out at a ceremony in March. Employees who receive this accolade wear a special name tag all year.\nSuch schemes may sound like kindergarten. But Bauer's human-resources staff think they have a powerful effect because they are so much more public than pay rises. They also point to other aspects of a job that individuals find rewarding: does their office have a window? Do they have a parking space? Can they work from home? Such thing can be immensely effective in rewarding good performance, and generally cost a lot less than a pay rise.\nPay alone rarely keeps people with an employer. In the war for talent, companies need better weapons than cash. They need to guarantee their stars a sequence of fascinating jobs; to give them a sense of belonging; and to tell them they are tops."}, {"q": "In the past, the company rewarded the job you did, and not how well you did it.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 67, "g": "Reading (34)", "p": "Companies frequently combine several different schemes to reward different kinds of achievement. Eddie Bauer, a clothing retailer, used to pay people mainly by the kind of job they did, not by how they did it. \"People knew they could change their pay by rewriting their job description, not by raising their productivity\", says Lori Fosnes, the senior compensation manager. But now staff can win more pay by being promoted - sideways as well as upwards, as long as they acquire new skills in the process - or by improving their personal performance. \nHowever, the company reinforces the message with something that makes it easier to reward teamwork: with prizes for good behavior. The most basic is a star, about four inches across, which can be stuck on a filing cabinet or a wall. It can be given by any \"associate\", as Bauer people c l. The Oscar of Bauer awards is the \"Best of Bauer\", decided by a \"legends\" committee and handed out at a ceremony in March. Employees who receive this accolade wear a special name tag all year.\nSuch schemes may sound like kindergarten. But Bauer's human-resources staff think they have a powerful effect because they are so much more public than pay rises. They also point to other aspects of a job that individuals find rewarding: does their office have a window? Do they have a parking space? Can they work from home? Such thing can be immensely effective in rewarding good performance, and generally cost a lot less than a pay rise.\nPay alone rarely keeps people with an employer. In the war for talent, companies need better weapons than cash. They need to guarantee their stars a sequence of fascinating jobs; to give them a sense of belonging; and to tell them they are tops."}, {"q": "Globalization has made people feel less worried about danger.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 71, "g": "Reading (35)", "p": "The world is a risky place, especially for those concerned with business and finance. Natural and man-made disasters, including forest fires, earthquakes, big industrial accidents, and various transport disasters have added to the feeling of danger. However, part of this fear is irrational. The world is not necessarily more dangerous. For most people in rich countries, life has become much safer in a number of important ways. Over the past century, their life expectancy has risen by around two-thirds. Workplaces, the wider environment, and many diseases have become less hazardous. So, it is not true to say that life has become riskier; instead, some risks have become smaller and some new ones have arrived.\nIt is now easier for people to study and learn from past risks by using information technology. For example, life-insurance companies have looked back at records of births and deaths to estimate lifespans and set insurance premiums. Thanks to computer models, epidemiologists are more successful at tracking diseases, and even man-made crises such as stockmarket crashes can be catalogued and studied to produce better forecasts. This technology is also providing better information on the costs of the problems when they do occur.\nInsurance works by shifting risks from a party that does not want to deal with them to one that does. For example, the cost of a house burning down can be moved from a homeowner to the insurance company and its shareholders. A stockmarket listing can shift business risks from a single family to thousands of investors worldwide."}, {"q": "Over the last 100 years, life expectancy has increased by over 65%.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 72, "g": "Reading (35)", "p": "The world is a risky place, especially for those concerned with business and finance. Natural and man-made disasters, including forest fires, earthquakes, big industrial accidents, and various transport disasters have added to the feeling of danger. However, part of this fear is irrational. The world is not necessarily more dangerous. For most people in rich countries, life has become much safer in a number of important ways. Over the past century, their life expectancy has risen by around two-thirds. Workplaces, the wider environment, and many diseases have become less hazardous. So, it is not true to say that life has become riskier; instead, some risks have become smaller and some new ones have arrived.\nIt is now easier for people to study and learn from past risks by using information technology. For example, life-insurance companies have looked back at records of births and deaths to estimate lifespans and set insurance premiums. Thanks to computer models, epidemiologists are more successful at tracking diseases, and even man-made crises such as stockmarket crashes can be catalogued and studied to produce better forecasts. This technology is also providing better information on the costs of the problems when they do occur.\nInsurance works by shifting risks from a party that does not want to deal with them to one that does. For example, the cost of a house burning down can be moved from a homeowner to the insurance company and its shareholders. A stockmarket listing can shift business risks from a single family to thousands of investors worldwide."}, {"q": "Looking at past risks can be done easily by using information technology.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 73, "g": "Reading (35)", "p": "The world is a risky place, especially for those concerned with business and finance. Natural and man-made disasters, including forest fires, earthquakes, big industrial accidents, and various transport disasters have added to the feeling of danger. However, part of this fear is irrational. The world is not necessarily more dangerous. For most people in rich countries, life has become much safer in a number of important ways. Over the past century, their life expectancy has risen by around two-thirds. Workplaces, the wider environment, and many diseases have become less hazardous. So, it is not true to say that life has become riskier; instead, some risks have become smaller and some new ones have arrived.\nIt is now easier for people to study and learn from past risks by using information technology. For example, life-insurance companies have looked back at records of births and deaths to estimate lifespans and set insurance premiums. Thanks to computer models, epidemiologists are more successful at tracking diseases, and even man-made crises such as stockmarket crashes can be catalogued and studied to produce better forecasts. This technology is also providing better information on the costs of the problems when they do occur.\nInsurance works by shifting risks from a party that does not want to deal with them to one that does. For example, the cost of a house burning down can be moved from a homeowner to the insurance company and its shareholders. A stockmarket listing can shift business risks from a single family to thousands of investors worldwide."}, {"q": "Epidemiologists predict storms and earthquakes.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 74, "g": "Reading (35)", "p": "The world is a risky place, especially for those concerned with business and finance. Natural and man-made disasters, including forest fires, earthquakes, big industrial accidents, and various transport disasters have added to the feeling of danger. However, part of this fear is irrational. The world is not necessarily more dangerous. For most people in rich countries, life has become much safer in a number of important ways. Over the past century, their life expectancy has risen by around two-thirds. Workplaces, the wider environment, and many diseases have become less hazardous. So, it is not true to say that life has become riskier; instead, some risks have become smaller and some new ones have arrived.\nIt is now easier for people to study and learn from past risks by using information technology. For example, life-insurance companies have looked back at records of births and deaths to estimate lifespans and set insurance premiums. Thanks to computer models, epidemiologists are more successful at tracking diseases, and even man-made crises such as stockmarket crashes can be catalogued and studied to produce better forecasts. This technology is also providing better information on the costs of the problems when they do occur.\nInsurance works by shifting risks from a party that does not want to deal with them to one that does. For example, the cost of a house burning down can be moved from a homeowner to the insurance company and its shareholders. A stockmarket listing can shift business risks from a single family to thousands of investors worldwide.", "e": "ℹ️ Đề gốc chọn FALSE (epidemiologists theo dõi bệnh tật, không dự báo bão/động đất). Có thể tranh luận là NOT GIVEN nhưng đáp án đề là FALSE."}, {"q": "Insurance spreads the cost of paying for problems from an individual to a group.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 75, "g": "Reading (35)", "p": "The world is a risky place, especially for those concerned with business and finance. Natural and man-made disasters, including forest fires, earthquakes, big industrial accidents, and various transport disasters have added to the feeling of danger. However, part of this fear is irrational. The world is not necessarily more dangerous. For most people in rich countries, life has become much safer in a number of important ways. Over the past century, their life expectancy has risen by around two-thirds. Workplaces, the wider environment, and many diseases have become less hazardous. So, it is not true to say that life has become riskier; instead, some risks have become smaller and some new ones have arrived.\nIt is now easier for people to study and learn from past risks by using information technology. For example, life-insurance companies have looked back at records of births and deaths to estimate lifespans and set insurance premiums. Thanks to computer models, epidemiologists are more successful at tracking diseases, and even man-made crises such as stockmarket crashes can be catalogued and studied to produce better forecasts. This technology is also providing better information on the costs of the problems when they do occur.\nInsurance works by shifting risks from a party that does not want to deal with them to one that does. For example, the cost of a house burning down can be moved from a homeowner to the insurance company and its shareholders. A stockmarket listing can shift business risks from a single family to thousands of investors worldwide."}, {"q": "Sally left her last job because she wanted to make decisions about her work herself.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 76, "g": "Reading (36)", "p": "A self-employed person refers to any person who earns their living from any independent pursuit of economic activity, as opposed to earning a living working for a company or another individual (an employer). A freelancer or an independent contractor who performs all of their work for a single client may still be a self-employed person.\nLast year, Sally Patterson left her permanent job with a newspaper and is now a self-employed journalist. Why did she do it? ‘I had no control over my work,’ she says, ‘and that mattered more to me than earning lots of money. Actually, leaving my job wasn’t as difficult as I’d expected, because I already had plenty of contacts in the publishing industry. Unlike my last job, though, I’m mostly in touch with the magazines and newspapers I write for by email, and as I don’t work in an office, I may not see anyone for days. But that’s a welcome relief!’\nIsn’t it hard being self-employed? ‘The biggest danger when you become self-employed is saying “yes” to everything,’ Sally says. ‘I make sure I turn work down if I haven’t got the time for it. And that’s a question of planning: I spend an hour every week working out what I’m doing for the next few months.’\nAnd what about the benefits? ‘Well, at the newspaper I always concentrated on economic matters, but now I can choose to work on a wider range of projects than before. And being my own boss has made me feel more confident about the other areas of my life, too.’"}, {"q": "Her colleagues in publishing thought that being self-employed would be difficult for her.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 77, "g": "Reading (36)", "p": "A self-employed person refers to any person who earns their living from any independent pursuit of economic activity, as opposed to earning a living working for a company or another individual (an employer). A freelancer or an independent contractor who performs all of their work for a single client may still be a self-employed person.\nLast year, Sally Patterson left her permanent job with a newspaper and is now a self-employed journalist. Why did she do it? ‘I had no control over my work,’ she says, ‘and that mattered more to me than earning lots of money. Actually, leaving my job wasn’t as difficult as I’d expected, because I already had plenty of contacts in the publishing industry. Unlike my last job, though, I’m mostly in touch with the magazines and newspapers I write for by email, and as I don’t work in an office, I may not see anyone for days. But that’s a welcome relief!’\nIsn’t it hard being self-employed? ‘The biggest danger when you become self-employed is saying “yes” to everything,’ Sally says. ‘I make sure I turn work down if I haven’t got the time for it. And that’s a question of planning: I spend an hour every week working out what I’m doing for the next few months.’\nAnd what about the benefits? ‘Well, at the newspaper I always concentrated on economic matters, but now I can choose to work on a wider range of projects than before. And being my own boss has made me feel more confident about the other areas of my life, too.’"}, {"q": "Most self-employed journalists find it difficult to plan ahead.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 78, "g": "Reading (36)", "p": "A self-employed person refers to any person who earns their living from any independent pursuit of economic activity, as opposed to earning a living working for a company or another individual (an employer). A freelancer or an independent contractor who performs all of their work for a single client may still be a self-employed person.\nLast year, Sally Patterson left her permanent job with a newspaper and is now a self-employed journalist. Why did she do it? ‘I had no control over my work,’ she says, ‘and that mattered more to me than earning lots of money. Actually, leaving my job wasn’t as difficult as I’d expected, because I already had plenty of contacts in the publishing industry. Unlike my last job, though, I’m mostly in touch with the magazines and newspapers I write for by email, and as I don’t work in an office, I may not see anyone for days. But that’s a welcome relief!’\nIsn’t it hard being self-employed? ‘The biggest danger when you become self-employed is saying “yes” to everything,’ Sally says. ‘I make sure I turn work down if I haven’t got the time for it. And that’s a question of planning: I spend an hour every week working out what I’m doing for the next few months.’\nAnd what about the benefits? ‘Well, at the newspaper I always concentrated on economic matters, but now I can choose to work on a wider range of projects than before. And being my own boss has made me feel more confident about the other areas of my life, too.’"}, {"q": "Sally specializes more now than she did in her last job.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 79, "g": "Reading (36)", "p": "A self-employed person refers to any person who earns their living from any independent pursuit of economic activity, as opposed to earning a living working for a company or another individual (an employer). A freelancer or an independent contractor who performs all of their work for a single client may still be a self-employed person.\nLast year, Sally Patterson left her permanent job with a newspaper and is now a self-employed journalist. Why did she do it? ‘I had no control over my work,’ she says, ‘and that mattered more to me than earning lots of money. Actually, leaving my job wasn’t as difficult as I’d expected, because I already had plenty of contacts in the publishing industry. Unlike my last job, though, I’m mostly in touch with the magazines and newspapers I write for by email, and as I don’t work in an office, I may not see anyone for days. But that’s a welcome relief!’\nIsn’t it hard being self-employed? ‘The biggest danger when you become self-employed is saying “yes” to everything,’ Sally says. ‘I make sure I turn work down if I haven’t got the time for it. And that’s a question of planning: I spend an hour every week working out what I’m doing for the next few months.’\nAnd what about the benefits? ‘Well, at the newspaper I always concentrated on economic matters, but now I can choose to work on a wider range of projects than before. And being my own boss has made me feel more confident about the other areas of my life, too.’", "e": "⚠️ File Word tô TRUE. Đoạn văn: trước đây Sally tập trung vào kinh tế, giờ làm <i>nhiều mảng rộng hơn<\/i> → chuyên môn hóa ít hơn → <b>FALSE<\/b>."}, {"q": "Self-employed has barely affected Sally’s attitudes to life.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 80, "g": "Reading (36)", "p": "A self-employed person refers to any person who earns their living from any independent pursuit of economic activity, as opposed to earning a living working for a company or another individual (an employer). A freelancer or an independent contractor who performs all of their work for a single client may still be a self-employed person.\nLast year, Sally Patterson left her permanent job with a newspaper and is now a self-employed journalist. Why did she do it? ‘I had no control over my work,’ she says, ‘and that mattered more to me than earning lots of money. Actually, leaving my job wasn’t as difficult as I’d expected, because I already had plenty of contacts in the publishing industry. Unlike my last job, though, I’m mostly in touch with the magazines and newspapers I write for by email, and as I don’t work in an office, I may not see anyone for days. But that’s a welcome relief!’\nIsn’t it hard being self-employed? ‘The biggest danger when you become self-employed is saying “yes” to everything,’ Sally says. ‘I make sure I turn work down if I haven’t got the time for it. And that’s a question of planning: I spend an hour every week working out what I’m doing for the next few months.’\nAnd what about the benefits? ‘Well, at the newspaper I always concentrated on economic matters, but now I can choose to work on a wider range of projects than before. And being my own boss has made me feel more confident about the other areas of my life, too.’"}, {"q": "eBay is regarded as the top online auction company.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 81, "g": "Reading (37)", "p": "BREAKING INTO NEW MARKETS\nThe term electronic commerce (ecommerce) refers to a business model that allows companies and individuals to buy and sell goods and services over the Internet. Ecommerce operates in four major market segments and can be conducted over computers, tablets, smartphones, and other smart devices.\nA business model for e-commerce?\neBay, the world’s leading online auctioneer, has a business model that definitely suits the internet. Thanks to many clever search features, it can match up sellers and buyers of even the most unfamiliar items. And because of its smart cost and revenue structure (it charges a modest commission on each transaction and does not store goods), eBay has been one of the most consistently profitable e-commerce businesses. In the first quarter, its net income more than doubled, to $104.2m, on revenues of $476m. This was partly due to eBay’s acquisition of PayPal, a payment business, last year.\nTaking out the effects of that deal, sales were up by 56% over the previous year. One of eBay’s greatest strengths, however, is also one of the biggest risks it faces. Its business, like any marketplace, is a natural monopoly, and so once it is established, it is pretty hard for a newcomer to challenge it. This has already aroused the interest of America’s Department of Justice. It took no action after an investigation a couple of years ago, but some think it will be tempted to take another look as eBay expands."}, {"q": "The company buys goods and holds them before reselling them.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 82, "g": "Reading (37)", "p": "BREAKING INTO NEW MARKETS\nThe term electronic commerce (ecommerce) refers to a business model that allows companies and individuals to buy and sell goods and services over the Internet. Ec   $('#q').innerHTML='<div class="qno">'+(set.kind=='mcq'?'Câu '+it.n+' / '+set.items.length:'Đoạn '+(s.i+1)+' / '+ls.length)+'</div>'+(set.kind=='mcq'?rMcq(it,k):rCz(it,k))}
 $('#bp').disabled=s.i==0;$('#bn').disabled=s.i>=ls.length-1;
 let g='',lg=null;ls.forEach((k,x)=>{const it=set.items[k],q=s.res[k];if(set.kind=='mcq'&&it.g&&it.g!=lg){g+='<div class="mg">'+esc(it.g)+'</div>';lg=it.g}
  g+='<button class="nb'+(x==s.i?' cur':'')+(q?(q.bad?' bad':' ok'):'')+'" onclick="go('+x+')">'+esc(it.n)+'</button>'});
 $('#grid').innerHTML=g;$('#mi').textContent=set.title+' — '+ls.length+' mục. Xanh = đúng, đỏ = sai.'}
function go(x){cs().i=x;if($('#menu').classList.contains('show'))tm();render();scrollTo(0,0)}
function mv(d){const s=cs();s.i=Math.max(0,Math.min(lst().length-1,s.i+d));render();scrollTo(0,0)}
function ss(i){si=i;render()}
function rv(){const s=cs();s.rev=!s.rev;s.i=0;render()}
function lm(){cs().learn=!cs().learn;render()}
function sh(){if(!confirm('Trộn thứ tự câu hỏi? (Kết quả của phần này sẽ được làm mới)'))return;const s=cs();for(let i=s.ord.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[s.ord[i],s.ord[j]]=[s.ord[j],s.ord[i]]}s.res={};s.rev=false;s.i=0;render()}
document.addEventListener('keydown',e=>{if(e.target.tagName=='SELECT')return;if(e.key=='Escape'&&$('#menu').classList.contains('show'))tm();else if(e.key=='ArrowRight')mv(1);else if(e.key=='ArrowLeft')mv(-1);
 else if(cd().kind=='mcq'&&'abcd'.includes(e.key.toLowerCase())&&e.key.length==1){const ls=lst();if(ls.length)pk(ls[cs().i],'abcd'.indexOf(e.key.toLowerCase()))}});
render();
