s, remains the ideal place to manufacture complex equipment. America, he believes, still produces top professionals.\nBut the bottom line is clear: without the benefit of buying and selling products around the world and employing skilled people from other countries, the 128-year-old company would be smaller than it is today.\nMr. Immelt set ambitious goals – a 10-per-cent annual growth in profits and an 8-per-cent increase in sales growth. Few companies in this country have grown so fast year after year, and none as big as GE."}, {"q": "According to the text, Mr. Immelt prefers to employ ________.", "o": ["talented people in the Asian region.", "American professionals.", "skilled people from outside the USA.", "the best people, wherever they are from."], "a": 3, "n": 64, "g": "Reading (13)", "p": "General Electric’s (GE) former leader, Jack Welch, was more typical of the imperial CEOs who wanted to control everything and made everyone totally obedient to him. Admired by analysts and feared by subordinates, Mr Welch ran GE with an aggression that helped to drive the company’s earnings to the maximum.\nBut Mr. Immelt created a quiet revolution in the company when he replaced Welch in 2001, bringing in a new approach to leadership.\nUnder Mr. Immelt, GE was a productivity machine where cutting costs and building value was the priority. When Mr. Immelt took over, GE needed to find a new way to cope with growing Asian competition and increasingly global markets. He changed GE by giving priority to organic growth and marketing superiority.\nMaking the company more global has been a key part of Mr. Immelt’s strategy. During his leadership, GE has become a multinational that earns half of its $150bn revenues from outside the country in 2010. But Mr. Immelt maintains that the US, where GE still employs 160,000 of its 316,000 employees, remains the ideal place to manufacture complex equipment. America, he believes, still produces top professionals.\nBut the bottom line is clear: without the benefit of buying and selling products around the world and employing skilled people from other countries, the 128-year-old company would be smaller than it is today.\nMr. Immelt set ambitious goals – a 10-per-cent annual growth in profits and an 8-per-cent increase in sales growth. Few companies in this country have grown so fast year after year, and none as big as GE.", "e": "⚠️ File Word tô \"American professionals\". Đoạn văn nói Immelt dùng cả người giỏi từ nước ngoài (skilled people from other countries) → mình chọn <b>the best people, wherever they are from<\/b>. Nếu đề thi của bạn đáp án khác, bám theo đề."}, {"q": "Which statement can best describe the meaning of the final sentence?", "o": ["General Electric has always been the biggest company in the world.", "General Electric has grown faster than most other companies in the USA.", "General Electric no longer manufactures complex equipment in the USA.", "General Electric could use professionals from other countries for sales growth."], "a": 1, "n": 65, "g": "Reading (13)", "p": "General Electric’s (GE) former leader, Jack Welch, was more typical of the imperial CEOs who wanted to control everything and made everyone totally obedient to him. Admired by analysts and feared by subordinates, Mr Welch ran GE with an aggression that helped to drive the company’s earnings to the maximum.\nBut Mr. Immelt created a quiet revolution in the company when he replaced Welch in 2001, bringing in a new approach to leadership.\nUnder Mr. Immelt, GE was a productivity machine where cutting costs and building value was the priority. When Mr. Immelt took over, GE needed to find a new way to cope with growing Asian competition and increasingly global markets. He changed GE by giving priority to organic growth and marketing superiority.\nMaking the company more global has been a key part of Mr. Immelt’s strategy. During his leadership, GE has become a multinational that earns half of its $150bn revenues from outside the country in 2010. But Mr. Immelt maintains that the US, where GE still employs 160,000 of its 316,000 employees, remains the ideal place to manufacture complex equipment. America, he believes, still produces top professionals.\nBut the bottom line is clear: without the benefit of buying and selling products around the world and employing skilled people from other countries, the 128-year-old company would be smaller than it is today.\nMr. Immelt set ambitious goals – a 10-per-cent annual growth in profits and an 8-per-cent increase in sales growth. Few companies in this country have grown so fast year after year, and none as big as GE."}, {"q": "Why does Steven Allcock use Excel and Word for his financial systems?", "o": ["He does not have enough money to use complicated programs", "He doesn’t know how to use purpose-built financial programs.", "He thinks they are more glamorous than other accounting programs.", "They are more cost-effective than specially designed programs."], "a": 3, "n": 66, "g": "Reading (14)", "p": "You don’t need complex and costly software to make a success of your business. Steven Allcock, the managing director of Blue 10, has used Microsoft Windows and Microsoft Office to build his own systems, which are better than any more glamorous packages. Allcock believes in simplicity. ‘I’ve tried to make all our procedures as simple and easy to use as possible,’ he says. ‘I must have been approached by a dozen companies selling specialist recruitment software, but the Excel and Word setup has been better and cheaper.’\nAllcock also rejected accounting software packages, preferring to build Blue 10’s financial ledgers himself using Excel. He has a ledger for expenses, assets and overheads, one for cash and sales, plus ledgers for VAT and PAYE. ‘I’ve made it so simple that it takes away all the labor-intensive work: Everything is in full view and I can see everything move.’\nThis enables Allcock to fulfill his roles as managing director: keeping the company stable and profitable, and identifying opportunities for growth. The simple spreadsheet reports four figures: inputs and outputs for the last 30 days, and liabilities and expected credits for the next 30. ‘These are the key numbers that my sales director and I need,’ says Allcock. \nWith plenty of experience in both running a business and using Excel, Allcock was able to set up his financial systems in a week. He took advice from business contacts, and from his accountant and tax advisor. He also built in some double-checks to ensure figures are entered accurately, and if he does make a mistake this can be found and corrected in a few minutes.\nUsing the system takes just half an hour a day, so Allcock does not need a separate accounts person. He takes daily back-up copies of all data on a CD, and once a week takes this home in case of unexpected problems. ‘If our office burned down, I could walk into a shop, buy a new PC, and have the company fully operational within hours,’ he says."}, {"q": "According to the text, who designed the accounting systems at Blue 10?", "o": ["Microsoft’s engineers", "The company’s accountant", "Steven Allcock", "Steven’s tax advisor"], "a": 2, "n": 67, "g": "Reading (14)", "p": "You don’t need complex and costly software to make a success of your business. Steven Allcock, the managing director of Blue 10, has used Microsoft Windows and Microsoft Office to build his own systems, which are better than any more glamorous packages. Allcock believes in simplicity. ‘I’ve tried to make all our procedures as simple and easy to use as possible,’ he says. ‘I must have been approached by a dozen companies selling specialist recruitment software, but the Excel and Word setup has been better and cheaper.’\nAllcock also rejected accounting software packages, preferring to build Blue 10’s financial ledgers himself using Excel. He has a ledger for expenses, assets and overheads, one for cash and sales, plus ledgers for VAT and PAYE. ‘I’ve made it so simple that it takes away all the labor-intensive work: Everything is in full view and I can see everything move.’\nThis enables Allcock to fulfill his roles as managing director: keeping the company stable and profitable, and identifying opportunities for growth. The simple spreadsheet reports four figures: inputs and outputs for the last 30 days, and liabilities and expected credits for the next 30. ‘These are the key numbers that my sales director and I need,’ says Allcock. \nWith plenty of experience in both running a business and using Excel, Allcock was able to set up his financial systems in a week. He took advice from business contacts, and from his accountant and tax advisor. He also built in some double-checks to ensure figures are entered accurately, and if he does make a mistake this can be found and corrected in a few minutes.\nUsing the system takes just half an hour a day, so Allcock does not need a separate accounts person. He takes daily back-up copies of all data on a CD, and once a week takes this home in case of unexpected problems. ‘If our office burned down, I could walk into a shop, buy a new PC, and have the company fully operational within hours,’ he says."}, {"q": "What is the most important financial information Steven needs to have?", "o": ["The level of stability and profitability in the company.", "Money coming in and out for the last and next month.", "The amount of credit the company expects in the next 30 days.", "The total amount of companies’ assets and overheads."], "a": 1, "n": 68, "g": "Reading (14)", "p": "You don’t need complex and costly software to make a success of your business. Steven Allcock, the managing director of Blue 10, has used Microsoft Windows and Microsoft Office to build his own systems, which are better than any more glamorous packages. Allcock believes in simplicity. ‘I’ve tried to make all our procedures as simple and easy to use as possible,’ he says. ‘I must have been approached by a dozen companies selling specialist recruitment software, but the Excel and Word setup has been better and cheaper.’\nAllcock also rejected accounting software packages, preferring to build Blue 10’s financial ledgers himself using Excel. He has a ledger for expenses, assets and overheads, one for cash and sales, plus ledgers for VAT and PAYE. ‘I’ve made it so simple that it takes away all the labor-intensive work: Everything is in full view and I can see everything move.’\nThis enables Allcock to fulfill his roles as managing director: keeping the company stable and profitable, and identifying opportunities for growth. The simple spreadsheet reports four figures: inputs and outputs for the last 30 days, and liabilities and expected credits for the next 30. ‘These are the key numbers that my sales director and I need,’ says Allcock. \nWith plenty of experience in both running a business and using Excel, Allcock was able to set up his financial systems in a week. He took advice from business contacts, and from his accountant and tax advisor. He also built in some double-checks to ensure figures are entered accurately, and if he does make a mistake this can be found and corrected in a few minutes.\nUsing the system takes just half an hour a day, so Allcock does not need a separate accounts person. He takes daily back-up copies of all data on a CD, and once a week takes this home in case of unexpected problems. ‘If our office burned down, I could walk into a shop, buy a new PC, and have the company fully operational within hours,’ he says."}, {"q": "Why doesn’t Steven need an accounts person?", "o": ["It takes very little time to use the Excel system.", "He dislikes putting everything on paper.", "The company cannot afford an accounts person.", "An accounts person can steal his ideas."], "a": 0, "n": 69, "g": "Reading (14)", "p": "You don’t need complex and costly software to make a success of your business. Steven Allcock, the managing director of Blue 10, has used Microsoft Windows and Microsoft Office to build his own systems, which are better than any more glamorous packages. Allcock believes in simplicity. ‘I’ve tried to make all our procedures as simple and easy to use as possible,’ he says. ‘I must have been approached by a dozen companies selling specialist recruitment software, but the Excel and Word setup has been better and cheaper.’\nAllcock also rejected accounting software packages, preferring to build Blue 10’s financial ledgers himself using Excel. He has a ledger for expenses, assets and overheads, one for cash and sales, plus ledgers for VAT and PAYE. ‘I’ve made it so simple that it takes away all the labor-intensive work: Everything is in full view and I can see everything move.’\nThis enables Allcock to fulfill his roles as managing director: keeping the company stable and profitable, and identifying opportunities for growth. The simple spreadsheet reports four figures: inputs and outputs for the last 30 days, and liabilities and expected credits for the next 30. ‘These are the key numbers that my sales director and I need,’ says Allcock. \nWith plenty of experience in both running a business and using Excel, Allcock was able to set up his financial systems in a week. He took advice from business contacts, and from his accountant and tax advisor. He also built in some double-checks to ensure figures are entered accurately, and if he does make a mistake this can be found and corrected in a few minutes.\nUsing the system takes just half an hour a day, so Allcock does not need a separate accounts person. He takes daily back-up copies of all data on a CD, and once a week takes this home in case of unexpected problems. ‘If our office burned down, I could walk into a shop, buy a new PC, and have the company fully operational within hours,’ he says."}, {"q": "Steven Allcock takes his back-up CD home each week ________.", "o": ["because he wants to double-check the figures.", "to show the figures to his accountant and tax advisor.", "because he does not want to lose the information from the office.", "because he does believe in his employees"], "a": 2, "n": 70, "g": "Reading (14)", "p": "You don’t need complex and costly software to make a success of your business. Steven Allcock, the managing director of Blue 10, has used Microsoft Windows and Microsoft Office to build his own systems, which are better than any more glamorous packages. Allcock believes in simplicity. ‘I’ve tried to make all our procedures as simple and easy to use as possible,’ he says. ‘I must have been approached by a dozen companies selling specialist recruitment software, but the Excel and Word setup has been better and cheaper.’\nAllcock also rejected accounting software packages, preferring to build Blue 10’s financial ledgers himself using Excel. He has a ledger for expenses, assets and overheads, one for cash and sales, plus ledgers for VAT and PAYE. ‘I’ve made it so simple that it takes away all the labor-intensive work: Everything is in full view and I can see everything move.’\nThis enables Allcock to fulfill his roles as managing director: keeping the company stable and profitable, and identifying opportunities for growth. The simple spreadsheet reports four figures: inputs and outputs for the last 30 days, and liabilities and expected credits for the next 30. ‘These are the key numbers that my sales director and I need,’ says Allcock. \nWith plenty of experience in both running a business and using Excel, Allcock was able to set up his financial systems in a week. He took advice from business contacts, and from his accountant and tax advisor. He also built in some double-checks to ensure figures are entered accurately, and if he does make a mistake this can be found and corrected in a few minutes.\nUsing the system takes just half an hour a day, so Allcock does not need a separate accounts person. He takes daily back-up copies of all data on a CD, and once a week takes this home in case of unexpected problems. ‘If our office burned down, I could walk into a shop, buy a new PC, and have the company fully operational within hours,’ he says."}, {"q": "What does Sue Cole day about people whose businesses are their hobbies?", "o": ["They have the perfect combination.", "They risk losing interest in their leisure activity.", "They know very little about raising finance.", "They cannot become a professional leader."], "a": 1, "n": 71, "g": "Reading (15)", "p": "According to Sue Cole, a management expert, there can be both advantages and disadvantages for those who combine their hobby with their career. ‘There’s a real possibility that your hobby becomes less attractive when it’s your job. But also, quite a few people who make their hobby their career become too enthusiastic and forget about the basic principles of business,’ she says. ‘For example, someone may think: “I love cooking. There aren’t enough restaurants in this area. I’ll start one up.” And they go ahead without establishing how many customers they’ll need each day or what income they’ll require to cover costs. That can be a recipe for disaster.’\nRichard Campbell, however, has made a success for it. A keen amateur singer with a passion for travel, he first became involved in organizing musical tours as a university student. On graduating, he joined a small student travel company, Sunway Travel, as a tour leader. Thirteen years later, in 1993, he bought the business and re-positioned it to focus entirely on musicians, both amateur and professional. It was a successful move and Sunway Travel now arranges worldwide travel for 80% of Britain’s classical musicians.\nCampbell explains that things haven’t always been easy. ‘Sometimes the company didn’t perform as well as I expected. There were difficult times and I had to learn to cope with the stress. However, we’ve now got to a level where my staff can run the business on daily basis and all I need is to keep an eye on important things.’\nCampbell recognizes that he could have earned more in another line of business. ‘Travel generally doesn’t pay well. But I have no regrets. They envy me because I am reasonably well paid to do something that I love doing.’"}, {"q": "According to the example of Sue Cole, why do people who open their own restaurant fail?", "o": ["They don’t learn enough about the competition.", "They don’t research how to attract customers.", "They don’t know what turnover levels they need.", "They don’t know how to change the recipe all the time."], "a": 2, "n": 72, "g": "Reading (15)", "p": "According to Sue Cole, a management expert, there can be both advantages and disadvantages for those who combine their hobby with their career. ‘There’s a real possibility that your hobby becomes less attractive when it’s your job. But also, quite a few people who make their hobby their career become too enthusiastic and forget about the basic principles of business,’ she says. ‘For example, someone may think: “I love cooking. There aren’t enough restaurants in this area. I’ll start one up.” And they go ahead without establishing how many customers they’ll need each day or what income they’ll require to cover costs. That can be a recipe for disaster.’\nRichard Campbell, however, has made a success for it. A keen amateur singer with a passion for travel, he first became involved in organizing musical tours as a university student. On graduating, he joined a small student travel company, Sunway Travel, as a tour leader. Thirteen years later, in 1993, he bought the business and re-positioned it to focus entirely on musicians, both amateur and professional. It was a successful move and Sunway Travel now arranges worldwide travel for 80% of Britain’s classical musicians.\nCampbell explains that things haven’t always been easy. ‘Sometimes the company didn’t perform as well as I expected. There were difficult times and I had to learn to cope with the stress. However, we’ve now got to a level where my staff can run the business on hings haven’t always been easy. ‘Sometimes the company didn’t perform as well as I expected. There were difficult times and I had to learn to cope with the stress. However, we’ve now got to a level where my staff can run the business on daily basis and all I need is to keep an eye on important things.’\nCampbell recognizes that he could have earned more in another line of business. ‘Travel generally doesn’t pay well. But I have no regrets. They envy me because I am reasonably well paid to do something that I love doing.’"}, {"q": "According to the article, which statement does NOT show that a person is an effective leader?", "o": ["He is ready to work at any time.", "He has strong desire for work.", "He does not want to miss a crucial meeting.", "He spends a lot of time with his employees."], "a": 3, "n": 76, "g": "Reading (16)", "p": "It is not possible to achieve a balance between work and life if you want to do well in business. To reduce only your workload will fail, because in real life success in work depends on achieving targets. In a competitive business environment, leadership takes different qualities and skills – including commitment, passion, and of course a lot of time.\n         A work–life balance is not just about people wanting to leave the office at a reasonable time – they know that they have to compete against those who are prepared to work until the early hours. Take Pavan Vishnakarma, a freelance software developer who lives in Bhopal, for instance. He advertises himself as being available for work at any time.\n         The answer is surely to look for balance across our whole lives, rather than at any particular time. Life is about deciding what is important to you – and sometimes making hard decisions. There are periods when we want to devote ourselves to work and others when the family is more important.\n          It’s not that a work-life balance isn’t worth having. It certainly is. It’s just that it has its price. This is that you are no g (17)", "p": "A   Being good at conversation is a key skill – both socially and in business. However, this is something British businesses are only starting to realise. These companies are gradually recognising that good conversation is more than just making sure the person you’re speaking to has got your message. It’s about listening to the other person and responding. This two-way interaction generates idea after idea.\nB    Mark Satchell of TDR International says, ‘Managers used to see their staff chatting as a sign of them wasting their time or not having enough to do. What managers failed to see was the way conversation builds relationship – between employees and between staff and their managers. In addition, conversation enables colleagues to work better as a team. This in turn aids company loyalty, staff retention and, ultimately, productivity!’\nC   It may come as a surprise to some what people can learn from casual conversation. The office cleaner of a large London organisation, for instance, was chatting to the MD early in the morning and happened to mention that staff regularly left their windows open. Nothing more than that! But, within a week staff had been reminded by the MD to close their windows before going home, office security improved and the heating bill was reduced!\nD   Face-to-face conversation puts people in touch with each other, rather than distancing them, as e-mails are often said to do. This kind of communication can reduce stress in the workplace. This is because it enables people to discuss issues and solve everyday work difficulties. If employees can’t sort out problems among themselves, they can grow into something much bigger! \nE   So, as Malcolm Rogers of the Mallory Business School says, ‘I think it would be a good idea to do the same things our Spanish, Italian, French and Portuguese colleagues do – greet everyone in the morning, have a coffee together, enjoy an extended lunch and, most importantly, engage in some good old-fashioned conversations.’"}, {"q": "According to paragraph (A), all of the following are true of a good conversation EXCEPT ________.", "o": ["The person you’re speaking to has got your message.", "You have to listen to the other person.", "You have to respond to others’ statements.", "You need to realise their business conditions."], "a": 3, "n": 82, "g": "Reading (17)", "p": "A   Being good at conversation is a key skill – both socially and in business. However, this is something British businesses are only starting to realise. These companies are gradually recognising that good conversation is more than just making sure the person you’re speaking to has got your message. It’s about listening to the other person and responding. This two-way interaction generates idea after idea.\nB    Mark Satchell of TDR International says, ‘Managers used to see their staff chatting as a sign of them wasting their time or not having enough to do. What managers failed to see was the way conversation builds relationship – between employees and between staff and their managers. In addition, conversation enables colleagues to work better as a team. This in turn aids company loyalty, staff retention and, ultimately, productivity!’\nC   It may come as a surprise to some what people can learn from casual conversation. The office cleaner of a large London organisation, for instance, was chatting to the MD early in the morning and happened to mention that staff regularly left their windows open. Nothing more than that! But, within a week staff had been reminded by the MD to close their windows before going home, office security improved and the heating bill was reduced!\nD   Face-to-face conversation puts people in touch with each other, rather than distancing them, as e-mails are often said to do. This kind of communication can reduce stress in the workplace. This is because it enables people to discuss issues and solve everyday work difficulties. If employees can’t sort out problems among as the way conversation builds relationship – between employees and between staff and their managers. In addition, conversation enables colleagues to work better as a team. This in turn aids company loyalty, staff retention and, ultimately, productivity!’\nC   It may come as a surprise to some what people can learn from casual conversation. The office cleaner of a large London organisation, for instance, was chatting to the MD early in the morning and happened to mention that staff regularly left their windows open. Nothing more than that! But, within a week staff had been reminded by the MD to close their windows before going home, office security improved and the heating bill was reduced!\nD   Face-to-face conversation puts people in touch with each other, rather than distancing them, as e-mails are often said to do. This kind of communication can reduce stress in the workplace. This is because it enables people to discuss issues and solve everyday work difficulties. If employees can’t sort out problems among themselves, they can grow into something much bigger! \nE   So, as Malcolm Rogers of the Mallory Business School says, ‘I think it would be a good idea to do the same things our Spanish, Italian, French and Portuguese colleagues do – greet everyone in the morning, have a coffee together, enjoy an extended lunch and, most importantly, engage in some good old-fashioned conversations.’"}, {"q": "The writer suggests that in the past _______.", "o": ["manufacturers were more powerful than customers", "manufacturers were less powerful than customers", "retailers were less powerful than customers", "customers were always the most powerful factors"], "a": 0, "n": 86, "g": "Reading (18)", "p": "Fifty years ago, when products were more individual, manufacturers had the upper hand. They could charge a lot for successful items because they were made in small quantities. As competition increased and became more global, there were more products to choose from and they increasingly resembled each other. This gave retailers the advantage because they could pick and choose which products to sell, and demand the best prices from suppliers. Now the consumer is taking command.\nThe arrival of the internet is one of the things responsible for the big shift in power. The web makes it easy for people to discover who offered the best deal. This could still be a retailer, but it could also be a manufacturer selling directly to consumers, or a trader on eBay.\nThe group to watch closely is the young generation. 18-to 34-year-olds see the internet as one of their most important sources of information and entertainment. For this age group, the internet will remain the dominant medium and part of their lives. This does not mean they will reject the traditional retail environment entirely. Shops will be as much part of their parents or grandparents. But some shops may be used in different ways. One indication is the growth of brand showrooms, such as the Apple and Sony stores. Their main role is to demonstrate a range of the company’s products, with knowledgeable and enthusiastic staff on hand who are under no pressure to clinch a sale. Where people actually buy the product in the end becomes of secondary importance.\nAs media become increasingly interactive, consumers will be able to exercise more choices. Getting advertising is optional – so it will need to be good, useful, and relevant to their lives. But traditional mass-media advertising will continue to have a role, at least for the foreseeable future."}, {"q": "The writer says some people use the internet to _______.", "o": ["get information about the companies.", "compare comments and reviews.", "compare prices before making a purchase.", "demand the best prices from retailers"], "a": 2, "n": 87, "g": "Reading (18)", "p": "Fifty years ago, when products were more individual, manufacturers had the upper hand. They could charge a lot for successful items because they were made in small quantit a advertising will continue to have a role, at least for the foreseeable future."}, {"q": "In India, the best call centers are _______.", "o": ["not famous.", "owed by media stars.", "very famous.", "becoming less productive."], "a": 0, "n": 91, "g": "Reading (19)", "p": "In India, the people who run the call centers are endlessly featured in the media but not well-known. However, its IT industry is growing at an incredible rate. Last year the industry achieved sales of $16 billion. The big firms are hiring about 1,000 graduates a month straight from Indian technical colleges.\nThe sales of Infosys alone, one of the top providers of IT services, have grown rapidly in the last five years. The firm claims to run the biggest corporate training facility in the world, with 4,000 students at a time and three courses a year. The company’s chairman says Infosys is going to expand further. \nIndia’s BPO (business-process-outsourcing) industry is younger and smaller but growing even faster. Last year its sales were $3.6 billion; by 2018 they are expected to reach $21 billion or even $24 billion. About 70% of the BPO industry’s revenue comes from call centers; 20% from high-volume, low-value data work, such as transcribing health-insurance claims; and the remaining 10% from higher-value information work, such as dealing with insurance claims.\nFor the moment, India accounts for about 80% of the low-cost offshore market. In the long run, it is sure to face hotter competition, especially from China and Russia. When it does, the quality of its infrastructure will become crucial. The most important thing to improve is India’s airports, says Mr Murthy of Infosys. After airports, Mr Murthy lists better hotels, roads, schools and power supply, in that order."}, {"q": "The IT industry in India is growing _______.", "o": ["very quickly.", "very slowly.", "at a steady rate.", "more slowly than ever"], "a": 0, "n": 92, "g": "Reading (19)", "p": "In India, the people who run the call cent . Two-thirds of Halma’s sales and profits growth in the next few years could come from existing product areas and the rest from areas that Halma has not yet discovered. It is difficult to predict what they will be but Mr O’Shea is confident that they will be in markets with the possibility of long-term growth. ‘I get annoyed when people describe a market as a neat pie chart with lines drawn on it,’ he says. ‘Real markets are not like that. They are messy and can change in a very short time. If you realize that, you have the chance to do well.’"}, {"q": "Demand for Halma’s products is growing worldwide because _______.", "o": ["technology is developing so quickly", "the company is marketing them strongly overseas", "health and safety laws are becoming stricter", "customers require better products and services"], "a": 2, "n": 97, "g": "Reading (20)", "p": "Since 1993, turnover at Halma has increased from £135 to over £290m and in the financial year 2003/04, the group reported a pre-tax net profit of £36.7m. Part of Halma’s success can be explained by tighter legislation over health and safety, which is being introduced all over the world. However, it is also due to its focus on development of ideas. Since the mid 1990s, Halma’s pre-tax return on capital employed has been impressively high compared with many other engineering companies. This is largely because the company does not manufacture its own parts. Companies which do this often have problems converting money which has been invested in machinery into profits. Another factor in Halma’s success is its good relationship with its customers. Although they are not told much about the engineering processes, Halma makes a strong effort to maintain close contact with them worldwide. In 2003/04, £216.8m of the group’s earnings came from customers abroad.\nSo, what does the future hold for Halma? Mr O’Shea believes that the company could expand further. Two-thirds of Halma’s sales and profits growth in the next few years f its bike-making machinery in an effort to cut costs and save money. The company’s Leicester factory is now only an assembly plant as most of the parts are imported.\nThe company produces half a million bikes a year across the full Cycle World range, with nearly all of these being sold in the UK. Production is largely done by hand. Workers use the batch production method - everyone making up to 600 bikes of a particular model at any one time.\nAt the height of its success, Cycle World employed 7,000 people but, like many areas of manufacturing, it has since shrunk. Its 1950 purpose-built factory now employs just 470 permanent workers, with numbers rising to 700 as temporary staff are taken on to meet seasonal demands in sales."}, {"q": "The headquarters of Unigroup will close after the rest of the business has broken up.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 6, "g": "Reading (22)", "p": "Unigroup, the hotel chain, has recently announced that it will close its headquarters in London as part of its attempt to reduce costs ahead of its break-up.\nThe group, currently fighting off a takeover bid from Rockford Investments, is keen to show shareholders it can save £100m as part of its defense. It is also selling hotels in London and several more in the US. Unigroup has started a program there for making staff redundant and is considering further job cuts across Europe.\nUnigroup spent Friday putting forward its arguments to shareholders. It is understood that the shareholders have asked the company to postpone the meeting at which they will vote on Rockford the chance to reconsider the package it is offering, parts of which were criticized by its own shareholders.\nRockford has maintained that Unigroup shareholders have given it a friendly reception, but refused to comment on its bid, currently worth 648p per share.\nThe battle increased last Friday when Unigroup management complained to the Takeover Board about negative comments a Rockford representative had made about the company at a press conference earlier that day. Rockford later apologized for what its representative had said."}, {"q": "Unigroup is cutting costs to help persuade shareholders to reject a rival takeover bid.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 7, "g": "Reading (22)", "p": "Unigroup, the hotel chain, has recently announced that it will close its headquarters in London as part of its attempt to reduce costs ahead of its break-up.\nThe group, currently fighting off a takeover bid from Rockford Investments, is keen to show shareholders it can save £100m as part of its defense. It is also selling hotels in London and several more in the US. Unigroup has started a program there for making staff redundant and is considering further job cuts across Europe.\nUnigroup spent Friday putting forward its arguments to shareholders. It is understood that the shareholders have asked the company to postpone the meeting at which they will vote on Rockford the chance to reconsider the package it is offering, parts of which were criticized by its own shareholders.\nRockford has maintained that Unigroup shareholders have given it a friendly reception, but refused to comment on its bid, currently worth 648p per share.\nThe battle increased last Friday when Unigroup management complained to the Takeover Board about negative comments a Rockford representative had made about the company at a press conference earlier that day. Rockford later apologized for what its representative had said."}, {"q": "Unigroup’s shareholders wish to delay their decision on Rockford’s proposal.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 8, "g": "Reading (22)", "p": "Unigroup, the hotel chain, has recently announced that it will close its headquarters in London as part of its attempt to reduce costs ahead of its break-up.\nThe group, currently fighting off a takeover bid from Rockford Investments, is keen to show shareholders it can save £100m as part of its defense. I are.\nThe battle increased last Friday when Unigroup management complained to the Takeover Board about negative comments a Rockford representative had made about the company at a press conference earlier that day. Rockford later apologized for what its representative had said.", "e": "⚠️ File Word tô TRUE, còn đáp án PDF là FALSE. Đoạn văn: gói đề nghị của Rockford bị chính cổ đông của Rockford chỉ trích → <b>FALSE<\/b>."}, {"q": "It is believed Rockford will increase its bid if the current one looks likely to fail", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 10, "g": "Reading (22)", "p": "Unigroup, the hotel chain, has recently announced that it will close its headquarters in London as part of its attempt to reduce costs ahead of its break-up.\nThe group, currently fighting off a takeover bid from Rockford Investments, is keen to show shareholders it can save £100m as part of its defense. It is also selling hotels in London and several more in the US. Unigroup has started a program there for making staff redundant and is considering further job cuts across Europe.\nUnigroup spent Friday putting forward its arguments to shareholders. It is understood that the shareholders have asked the company to postpone the meeting at which they will vote on Rockford the chance to reconsider the package it is offering, parts of which were criticized by its own shareholders.\nRockford has maintained that Unigroup shareholders have given it a friendly reception, but refused to comment on its bid, currently worth 648p per share.\nThe battle increased last Friday when Unigroup management complained to the Takeover Board about negative comments a Rockford representative had made about the company at a press conference earlier that day. Rockford later apologized for what its representative had said."}, {"q": "This is the first year that Loyalty customers are paying less for their house insurance.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 11, "g": "Reading (23)", "p": "GOOD NEWS FROM AN INSURANCE COMPANY\nCustomer loyalty is an important issue for the insurance sector since retaining a customer cost much less than acquiring new ones. The best way to build customer loyalty is to make sure that the customers are satisfied with the services they have subscribed to, and in the insurance industry, the quality of the services will be tested especially when a claim is filed.\nFor the fifth year in a row, the Loyalty Insurance Company has cut the cost of its house insurance. More than a million people with homes insured by the company will benefit from decreases of between two and four percent on the amount they will have to pay this year. This move goes against the market trend, with other insures increasing rates by an average one percent.\n‘The level of claims has been lower than usual over this period, allowing us to make these welcome reductions,’ says Malcolm Broad, Loyalty’s general manager.\nAlthough the cost of insuring a car with Loyalty has increased by six percent this year, it is still the smallest rise in the insurance industry; most other companies’ rates are, on average, ten percent higher than they were last year.\n‘The company has always believed in passing on any improvement in its financial position to its customers,’ says Mr. Broad. “Without doubt, this has led to a continual expansion of our business over the past few years.’"}, {"q": "Insuring a house with Loyalty will be at least four percent cheaper than last year.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 12, "g": "Reading (23)", "p": "GOOD NEWS FROM AN INSURANCE COMPANY\nCustomer loyalty is an important issue for the insurance sector since retaining a customer cost much less than acquiring new ones. The best way to build customer loyalty is to make sure that the customers are satisfied with the services they have subscribed to, and in the insurance industry, the quality of the services will be tested especially when a claim is filed.\nFor the fifth year in a row, the Loyalty Insurance Company has cut the cost of its house insurance. More than a million people with homes insured by the company will benefit from decreases of between two and four percent on the amount they will have to pay this year. This move goes against the market trend, with other insures increasing rates by an average one percent.\n‘The level of claims has been lower than usual over this period, allowing us to make these welcome reductions,’ says Malcolm Broad, Loyalty’s general manager.\nAlthough the cost of insuring a car with Loyalty has increased by six percent this year, it is still the smallest rise in the insurance industry; most other companies’ rates are, on average, ten percent higher than they were last year.\n‘The company has always believed in passing on any improvement in its financial position to its customers,’ says Mr. Broad. “Without doubt, this has led to a continual expansion of our business over the past few years.’"}, {"q": "Loyalty is performing in a different way from other insurance companies.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 13, "g": "Reading (23)", "p": "GOOD NEWS FROM AN INSURANCE COMPANY\nCustomer loyalty is an important issue for the insurance sector since retaining a customer cost much less than acquiring new ones. The best way to build customer loyalty is to make sure that the customers are satisfied with the services they have subscribed to, and in the insurance industry, the quality of the services will be tested especially when a claim is filed.\nFor the fifth year in a row, the Loyalty Insurance Company has cut the cost of its house insurance. More than a million people with homes insured by the company will benefit from decreases of between two and four percent on the amount they will have to pay this year. This move goes against the market trend, with other insures increasing rates by an average one percent.\n‘The level of claims has been lower than usual over this period, allowing us to t doubt, this has led to a continual expansion of our business over the past few years.’"}, {"q": "It is Loyalty’s policy to share its success with its customers.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 15, "g": "Reading (23)", "p": "GOOD NEWS FROM AN INSURANCE COMPANY\nCustomer loyalty is an important issue for the insurance sector since retaining a customer cost much less than acquiring new ones. The best way to build customer loyalty is to make sure that the customers are satisfied with the services they have subscribed to, and in the insurance industry, the quality of the services will be tested especially when a claim is filed.\nFor the fifth year in a row, the Loyalty Insurance Company has cut the cost of its house insurance. More than a million people with homes insured by the company will benefit from decreases of between two and four percent on the amount they will have to pay this year. This move goes against the market trend, with other insures increasing rates by an average one percent.\n‘The level of claims has been lower than usual over this period, allowing us to make these welcome reductions,’ says Malcolm Broad, Loyalty’s general manager.\nAlthough the cost of insuring a car with Loyalty has increased by six percent this year, it is still the smallest rise in the insurance industry; most other companies’ rates are, on average, ten percent higher than they were last year.\n‘The company has always believed in passing on any improvement in its financial position to its customers,’ says Mr. Broad. “Without doubt, this has led to a continual expansion of our business over the past few years.’"}, {"q": "Sheffield was for a long time a leader in the production of steel.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 16, "g": "Reading (24)", "p": "Records show that tools were being made in Sheffield as long ago as the 13th century. The city not only produced steel and made metal goods, but also pioneered the processes by which they were made; for example, the first stainless steel was produced in 1913.\nThe first large-scale works in Sheffield each employed up to 500 workers. But these were dwarfed by the massive steel and engineering works that grew up in the east of the city after the 1890s. During its peak, Sheffield was producing 90% of all British-made steel and 50% of all that made in Europe.\nThe metal industries were secretly hit in the late 1970s and 1980s. There was overcapacity in Europe, and the government of the 1979 was not prepared to continue subscribing the industry.\nAfter the 13-week national steel strike in 1980, the steel, engineering and metal manufacturing industries suffered huge redundancies. In 1981, there were 27,000 jobs in steel production in Sheffield and 43,000 in engineering and metal manufacturing. By 1991, there were just 7,000 jobs in steel and fewer than 30,000 in engineering and metal manufacturing.\nAlthough heavy industry now plays a much-reduced role, for the past six years Sheffield has had the fastest growing city economy outside London."}, {"q": "The factories built in the east of Sheffield after 1890 were larger than the earlier ones.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 17, "g": "Reading (24)", "p": "Records show that tools were being made in Sheffield as long ago as the 13th century. The city not only produced steel and made metal goods, but also pioneered the processes by which they were made; for example, the first stainless steel was produced in 1913.\nThe first large-scale works in Sheffield each employed up to 500 workers. But these were dwarfed by the massive steel and engineering works that grew up in the east of the city after the 1890s. During its peak, Sheffield was producing 90% of all British-made steel and 50% of all that made in Europe.\nThe metal industries were secretly hit in the late 1970s and 1980s. There was overcapacity in Europe, and the government of the 1979 was not prepared to continue subscribing the industry.\nAfter the 13-week national steel strike in 1980, the steel, engineering and metal manufacturing industries suffered huge redundancies. In 1981, there were 27,000 jobs in steel production in Sheffield and 43,000 in engineering and metal manufacturing. By 1991, there were just 7,000 jobs in steel and fewer than 30,000 in engineering and metal manufacturing.\nAlthough heavy industry now plays a much-reduced role, for the past six years Sheffield has had the fastest growing city economy outside London."}, {"q": "At its height, Sheffield was producing almost all of the steel in Europe.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 18, "g": "Reading (24)", "p": "Records show that tools were being made in Sheffield as long ago as the 13th century. The city not only produced steel and made metal goods, but also pioneered the processes by which they were made; for example, the first stainless steel was produced in 1913.\nThe first large-scale works in Sheffield each employed up to 500 workers. But these were dwarfed by the massive steel and engineering works that grew up in the east of the city after the 1890s. During its peak, Sheffield was producing 90% of all British-made steel and 50% of all that made in Europe.\nThe metal industries were secretly hit in the late 1970s and 1980s. There was overcapacity in Europe, and the government of the 1979 was not prepared to continue subscribing the industry.\nAfter the 13-week national steel strike in 1980, the steel, engineering and metal manufacturing industries suffered huge redundancies. In 1981, there were 27,000 jobs in steel production in Sheffield and 43,000 in engineering and metal manufacturing. By 1991, there were just 7,000 jobs in steel and fewer than 30,000 in engineering and metal manufacturing.\nAlthough heavy industry now plays a much-reduced role, for the past six years Sheffield has had the fastest growing city economy outside London."}, {"q": "After 1979, the British government agreed to put money into the steel industry.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 19, "g": "Reading (24)", "p": "Records show that tools were being made in Sheffield as long ago as the 13th century. The city not only produced steel and made metal goods, but also pioneered the processes by which they were made; for example, the first stainless steel was produced in 1913.\nThe first large-scale works in Sheffield each employed up to 500 workers. But these were dwarfed by the massive steel and engineering works that grew up in the east of the city after the 1890s. During its peak, Sheffield was producing 90% of all British-made steel and 50% of all that made in Europe.\nThe metal industries were secretly hit in the late 1970s and 1980s. There was overcapacity in Europe, and the government of the 1979 was not prepared to continue subscribing the industry.\nAfter the 13-week national steel strike in 1980, the steel, engineering and metal manufacturing industries suffered huge redundancies. In 1981, there were 27,000 jobs in steel production in Sheffield and 43,000 in engineering and metal manufacturing. By 1991, there were just 7,000 jobs in steel and fewer than 30,000 in engineering and metal manufacturing.\nAlthough heavy industry now plays a much-reduced role, for the past six years Sheffield has had the fastest growing city economy outside London."}, {"q": "The steel strike in 1980 was part of a general strike all over Britain.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 20, "g": "Reading (24)", "p": "Records show that tools were being made in Sheffield as long ago as the 13th century. The city not only produced steel and made metal goods, but also pioneered the processes by which they were made; for example, the first stainless steel was produced in 1913.\nThe first large-scale works in Sheffield each employed up to 500 workers. But these were dwarfed by the massive steel and engineering works that grew up in the east of the city after the 1890s. During its peak, Sheffield was producing 90% of all British-made steel and 50% of all that made in Europe.\nThe metal industries were secretly hit in the late 1970s and 1980s. There was overcapacity in Europe, and the government of the 1979 was not prepared to continue subscribing the industry.\nAfter the 13-week national steel strike in 1980, the steel, engineering and metal manufacturing industries suffered huge redundancies. In 1981, there were 27,000 jobs in steel production in Sheffield and 43,000 in engineering and metal manufacturing. By 1991, there were just 7,000 jobs in steel and fewer than 30,000 in engineering and metal manufacturing.\nAlthough heavy industry now plays a much-reduced role, for the past six years Sheffield has had the fastest growing city economy outside London."}, {"q": "To join the Leadership program, you need to have a university degree.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 21, "g": "Reading (25)", "p": "Woolworths graduate training program\nOur graduate recruits are our next generation of business leaders.\nWhen you join us, you’ll enroll on our Woolworths Group Leadership Program (WGLP) which will put you on the fast track to a senior management role in one of our central functions (e.g., buying, finance, supply chain, systems, human resources or marketing).\nYou’ll undertake a comprehensive program of training in general management techniques and specialist skills relevant to your functional discipline. With input from leading business academics at City University, the WGLP will expose you to the latest strategic business thinking. You’ll also receive support as you pursue professional qualifications in your field.\nYour first few months will be spent working alongside a store management team. You’ll learn the essential store management disciplines and gain insight into our customers, brands and products. After that, you’ll join your functional team where you’ll take on meaningful responsibility from the word go.\nYou’ll be mentored by senior managers who have already established themselves in the business, and you’ll be part of a group-wide network of WGLP participants. There will also be opportunities for you to move between companies as you develop your career."}, {"q": "Enrolment on the program guarantees you a job as a senior manager", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 22, "g": "Reading (25)", "p": "Woolworths graduate training program\nOur graduate recruits are our next generation of business leaders.\nWhen you join us, you’ll enroll on our Woolworths Group Leadership Program (WGLP) which will put you on the fast track to a senior management role in one of our central functions (e.g., buying, finance, supply chain, systems, human resources or marketing).\nYou’ll undertake a comprehensive program of training in general management techniques and specialist skills relevant to your functional discipline. With input from leading business academics at City University, the WGLP will expose you to the latest strategic business thinking. You’ll also receive support as you pursue professional qualifications in your field.\nYour first few months will be spent working alongside a store management team. You’ll learn the essential store management disciplines and gain insight into our customers, brands and products. After that, you’ll join your functional team where you’ll take on meaningful responsibility from the word go.\nYou’ll be mentored by senior managers who have already established themselves in the business, and you’ll be part of a group-wide network of WGLP participants. There will also be opportunities for you to move between companies as you develop your career."}, {"q": "Part of the program is led by university lecturers.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 23, "g": "Reading (25)", "p": "Woolworths graduate training program\nOur graduate recruits are our next generation of business leaders.\nWhen you join us, you’ll enroll on our Woolworths Group Leadership Program (WG reer."}, {"q": "It is simple to buy a franchise operation", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 26, "g": "Reading (26)", "p": "Franchising: ask the right questions and you should be on the road to success in your venture, advises Michael Becket.\nFranchising operators seem to have a simple approach when it comes to recruiting. ‘Don’t worry about what sort of work we’re doing, just roll up your sleeves and get down to it.’ Potential franchisees glancing through magazine advertisements could struggle to find out what line of business they are chasing because the wording is so vague.\nIt all seems to be a seller’s market. Certainly, the sector’s profile – there are almost 680 franchise systems operating in the UK – suggests business is booming. Figures released in the run-up to this week’s Franchise Exhibition at the Wembley exhibition and conference center show the industry is producing a turnover of £91⁄2 billion a year and providing more than 326,000 jobs.\nThe initial start-up cost is now averaging £59,200 and the typical franchise is generating a turnover of almost £300,000 a year while 91% of franchisees say they are making money.\nIt is impressive, but most of the large and reputable franchise operations complain they are suffering from a shortage of “suitable applicants”. More than 40% of franchisors say the biggest barrier to growth is a lack of franchisees they feel will make the grade."}, {"q": "Advertisements for franchises don’t always make it clear what kind of business involved.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 27, "g": "Reading (26)", "p": "Franchising: ask the right questions and you should be on the road to success in your venture, advises Michael Becket.\nFranchising operators seem to have a simple approach when it comes to recruiting. ‘Don’t worry about what sort of work we’re doing, just roll up your sleeves and get down to it.’ Potential franchisees glancing through magazine advertisements could struggle to find ou rld, cutting out the middlemen, and so they make sure that the maximum profit is returned to source. Fair trade also guarantees stability for producers and protects them against fluctuations in the market by offering secure, long-term prices which are over and above the market rate. Many schemes also offer prepayment or access to credit.\nThe fair-trade movement is not only restricted to foodstuffs. Crafts, clothing, jewelry and furniture are fairly traded in the same way – and the movement is growing. Around 1,700 world shops and fair-trade groups took part in the first European World Shop Day, in Day 1996, and there are now fair-trade organizations throughout the world. Public opinion surveys repeatedly show that people are happy to spend more money for fairly traded goods; Cafidirect, the first product to carry the Fairtrade Mark in Britain, is now the third best-selling coffee in one supermarket chain."}, {"q": "The fair-trade movement had been in existence for about a decade.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 32, "g": "Reading (27)", "p": "You probably know the statistics: whatever you pay for a jar of coffee in a supermarket, half goes to the manufacturer, a third to the supermarket itself, ten percent to the plantation where the coffee was grown, and about seven percent to the worker who picked the beans in the first place. The situation is getting worse: prices for raw commodities are now worth less than half what they were 15 years ago.\nIn the past ten years, the fair-trade movement has developed to provide an alternative to this situation. Fair trade organizations do business directly with producers in the developing world, cutting out the middlemen, and so they make sure that the maximum profit is returned to source. Fair trade also guarantees stability for producers and protects them against fluctuations in the market by offering secure, long-term prices which are over and above the market rate. Many schemes also offer prepayment or access to credit.\nThe fair-trade movement is not only restricted to foodstuffs. Crafts, clothing, jewelry and furniture are fairly traded in the same way – and the movement is growing. Around 1,700 world shops and fair-trade groups took part in the first European World Shop Day, in Day 1996, and there are now fair-trade organizations throughout the world. Public opinion surveys repeatedly show that people are happy to spend more money for fairly traded goods; Cafidirect, the first product to carry the Fairtrade Mark in Britain, is now the third best-selling coffee in one supermarket chain."}, {"q": "Fair trade organizations try to stop producers being exploited.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 33, "g": "Reading (27)", "p": "You probably know the statistics: whatever you pay for a jar of coffee in a supermarket, half goes to the manufacturer, a third to the supermarket itself, ten percent to the plantation where the coffee was grown, and about seven percent to the worker who picked the beans in the first place. The situation is getting worse: prices for raw commodities are now worth less than half what they were 15 years ago.\nIn the past ten years, the fair-trade movement has developed to provide an alternative to this situation. Fair trade organizations do business directly with producers in the developing world, cutting out the middlemen, and so they make sure that the maximum profit is returned to source. Fair trade also guarantees stability for producers and protects them against fluctuations in the market by offering secure, long-term prices which are over and above the market rate. Many schemes also offer prepayment or access to credit.\nThe fair-trade movement is not only restricted to foodstuffs. Crafts, clothing, jewelry and furniture are fairly traded in the same way – and the movement is growing. Around 1,700 world shops and fair-trade groups took part in the first European World Shop Day, in Day 1996, and there are now fair-trade organizations throughout the world. Public opinion surveys repeatedly show that people are happy to spend more money for fairly traded goods; Cafidirect, the first product to carry the Fairtrade Mark in Britain, is now the third best-selling coffee in one supermarket chain."}, {"q": "Producers offer manufacturers a 90-day credit period in which to pay them.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 34, "g": "Reading (27)", "p": "You probably know the statistics: whatever you pay for a jar of coffee in a supermarket, half goes to the manufacturer, a third to the supermarket itself, ten percent to the plantation where the coffee was grown, and about seven percent to the worker who picked the beans in the first place. The situation is getting worse: prices for raw commodities are now worth less than half what they were 15 years ago.\nIn the past ten years, the fair-trade movement has developed to provide an alternative to this situation. Fair trade organizations do business directly with producers in the developing world, cutting out the middlemen, and so they make sure that the maximum profit is returned to source. Fair trade also guarantees stability for producers and protects them against fluctuations in the market by offering secure, long-term prices which are over and above the market rate. Many schemes also offer prepayment or access to credit.\nThe fair-trade movement is not only restricted to foodstuffs. Crafts, clothing, jewelry and furniture are fairly traded in the same way – and the movement is growing. Around 1,700 world shops and fair-trade groups took part in the first European World Shop Day, in Day 1996, and there are now fair-trade organizations throughout the world. Public opinion surveys repeatedly show that people are happy to spend more money for fairly traded goods; Cafidirect, the first product to carry the Fairtrade Mark in Britain, is now the third best-selling coffee in one supermarket chain."}, {"q": "Cafidirect is popular because it is the cheapest brand of coffee in the supermarkets", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 35, "g": "Reading (27)", "p": "You probably know the statistics: whatever you pay for a jar of coffee in a supermarket, half goes to the manufacturer, a third to the supermarket itself, ten percent to the plantation where the coffee was grown, and about seven percent to the worker who picked the beans in the first place. The situation is getting worse: prices for raw commodities are now worth less than half what they were 15 years ago.\nIn the past ten years, the fair-trade movement has developed to provide an alternative to this situation. Fair trade organizations do business directly with producers in the developing world, cutting out the middlemen, and so they make sure that the maximum profit is returned to source. Fair trade also guarantees stability for producers and protects them against fluctuations in the market by offering secure, long-term prices which are over and above the market rate. Many schemes also offer prepayment or access to credit.\nThe fair-trade movement is not only restricted to foodstuffs. Crafts, clothing, jewelry and furniture are fairly traded in the same way – and the movement is growing. Around 1,700 world shops and fair-trade groups took part in the first European World Shop Day, in Day 1996, and there are now fair-trade organizations throughout the world. Public opinion surveys repeatedly show that people are happy to spend more money for fairly traded goods; Cafidirect, the first product to carry the Fairtrade Mark in Britain, is now the third best-selling coffee in one supermarket chain."}, {"q": "With a QVM machine, companies can avoid having a canteen altogether.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 36, "g": "Reading (28)", "p": "ADVERTISING FEATURE\nAdvertising is a paid form of communication that is used for the non-personal presentation of information that helps the general public or target audience to know and hing; no choice, no anxiety.\nThis situation is not limited to consumer items. With the greater mobility of people around the world, people have more choices about where they want to live and work – a fairly recent phenomenon. In the past, nations migrated across huge swathes of the earth in search of food, adventure, and more hospitable environments. Whole nations crossed continents and changed the face of history. So, the mobility of people is nothing new. The creation of nation states and borders effectively showed this process down. But what is different now is the speed at which migration is happening."}, {"q": "Products are kept and used for longer than in the past", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 42, "g": "Reading (29)", "p": "It is not just their availability that is the problem, but the speed with which new versions of products come on the market. Advances in design and production mean that new items are almost ready by the time that goods hit the shelves. Products also need to have a short lifespan so that the public can be persuaded to replace them within a short time. The classic example is computers, which are almost obsolete once they are bought. At first, there were only one or two available from a limited number of manufacturers, but now there are many companies all with not only their own products but different versions of the same machine. This makes selection a problem. Gone are the days when one could just walk with ease into a shop and buy one thing; no choice, no anxiety.\nThis situation is not limited to consumer items. With the greater mobility of people around the world, people have more choices about where they want to live and work – a fairly recent phenomenon. In the past, nations migrated across huge swathes of the earth in search of food, adventure, and more hospitable environments. Whole nations crossed continents and changed the face of history. So, the mobility of people is nothing new. The creation of nation state lled by recruits aged 18 to 24. The jobs include vacancies for butchers, bakers and fishmongers as well as checkout operators. Morrisons trains staff through its own food academy and is aiming to have trained 100,000 workers to NVQ Level 2 by next spring."}, {"q": "In McDonald’s, customer satisfaction is partly dependent on who the customers are served by.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 47, "g": "Reading (30)", "p": "Unemployment has costs to a society that are more than just financial. Unemployed individuals not only lose income but also face challenges to their physical and mental health. Societal costs of high unemployment include higher crime and a reduced rate of volunteerism.\nMore than one in six young people are out of work, raising fears of a ‘lost generation’ of potential workers, as unemployment hit a 14-year high. Even McDonald’s - a brand synonymous with today’s youth – appeared to anger its main customer base with a new campaign to boost the recruitment of older staff. According to a Lancaster University study commissioned by the company, customer satisfaction was 20 percent higher in those branches employing workers over 60. At present, 1,000 of McDonald’s 75,000 workers in Britain are over 60.\nYoung people were granted some hope yesterday as Morrisons, Britain’s fourth-largest supermarket, said that it would employ an extra 2,000 workers this year. As job losses have increased significantly during the recession, supermarkets have been among the biggest recruiters. Morrisons said yesterday that a third of the new jobs would be filled by recruits aged 18 to 24. The jobs include vacancies for butchers, bakers and fishmongers as well as checkout operators. Morrisons trains staff through its own food academy and is aiming to have trained 100,000 workers to NVQ Level 2 by next spring."}, {"q": "The majority of McDonald’s employees are over 60.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 48, "g": "Reading (30)", "p": "Unemploym sterday as Morrisons, Britain’s fourth-largest supermarket, said that it would employ an extra 2,000 workers this year. As job losses have increased significantly during the recession, supermarkets have been among the biggest recruiters. Morrisons said yesterday that a third of the new jobs would be filled by recruits aged 18 to 24. The jobs include vacancies for butchers, bakers and fishmongers as well as checkout operators. Morrisons trains staff through its own food academy and is aiming to have trained 100,000 workers to NVQ Level 2 by next spring."}, {"q": "More than half the new companies stay in business for four years.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 51, "g": "Reading (31)", "p": "More than half a million new businesses are created each year in America alone. Two-thirds of these businesses survive at least two years; half make it to at least four. So how does a company manage to go past the four-year mark? How does it manage to grow?\nPart of the challenge lies in the fact that growth is not always good. Companies can rush unprepared into new markets, expand without considering the demands made on their employees, or spend unwisely. Tom Bartlett, vice president of investor relations for Verizon Communications, is familiar with these problems. In September, Verizon began launching third-generation (3G) wireless networks in 14 cities in the United States. Similar European companies have yet to see a profit from their 3G investments, and Verizon has taken an expensive risk in a slow market, by signing a $4.5 billion contract extension with Lucent for 3G services in July.\nOne of the choices is whether to go public or stay private. Matthew Szulik, chief executive of Red Hat, which bundles Linux software for personal computers and larger networks, has made this decision twice. While discussing the growth of demand for his product, Mr Szulik admits that the consequences of going public during the dotcom boom were not totally positive for the firm."}, {"q": "Fast expansion can lead to huge debts in business.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 2, "n": 52, "g": "Reading (31)", "p": "More than half a million new businesses are created each year in America alone. Two-thirds of these businesses survive at least two years; half make it to at least four. So how does a company manage to go past the four-year mark? How does it manage to grow?\nPart of the challenge lies in the fact that growth is not always good. Companies can rush unprepared into new markets, expand without considering the demands made on their employees, or spend unwisely. Tom Bartlett, vice president of investor relations for Verizon Communications, is familiar with these problems. In September, Verizon began launching third-generation (3G) wireless networks in 14 cities in the United States. Similar European companies have yet to see a profit from their 3G investments, and Verizon has taken an expensive risk in a slow market, by signing a $4.5 billion contract extension with Lucent for 3G services in July.\nOne of the choices is whether to go public or stay private. Matthew Szulik, chief executive of Red Hat, which bundles Linux software for personal computers and larger networks, has made this decision twice. While discussing the growth of demand for his product, Mr Szulik admits that the consequences of going public during the dotcom boom were not totally positive for the firm."}, {"q": "Verizon launched its product around the world in September.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 1, "n": 53, "g": "Reading (31)", "p": "More than half a million new businesses are created each year in America alone. Two-thirds of these businesses survive at least two years; half make it to at least four. So how does a company manage to go past the four-year mark? How does it manage to grow?\nPart of the challenge lies in the fact that growth is not always good. Companies can rush unprepared into new markets, expand without considering the dema  Szulik, chief executive of Red Hat, which bundles Linux software for personal computers and larger networks, has made this decision twice. While discussing the growth of demand for his product, Mr Szulik admits that the consequences of going public during the dotcom boom were not totally positive for the firm."}, {"q": "Mr Szulik believes that going public was bad for Red Hat in some ways.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 55, "g": "Reading (31)", "p": "More than half a million new businesses are created each year in America alone. Two-thirds of these businesses survive at least two years; half make it to at least four. So how does a company manage to go past the four-year mark? How does it manage to grow?\nPart of the challenge lies in the fact that growth is not always good. Companies can rush unprepared into new markets, expand without considering the demands made on their employees, or spend unwisely. Tom Bartlett, vice president of investor relations for Verizon Communications, is familiar with these problems. In September, Verizon began launching third-generation (3G) wireless networks in 14 cities in the United States. Similar European companies have yet to see a profit from their 3G investments, and Verizon has taken an expensive risk in a slow market, by signing a $4.5 billion contract extension with Lucent for 3G services in July.\nOne of the choices is whether to go public or stay private. Matthew Szulik, chief executive of Red Hat, which bundles Linux software for personal computers and larger networks, has made this decision twice. While discussing the growth of demand for his product, Mr Szulik admits that the consequences of going public during the dotcom boom were not totally positive for the firm."}, {"q": "Donald Eisner comes from a rich family.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 56, "g": "Reading (32)", "p": "Many critics dislike reality TV but one show which has received very favorable reviews is Changing Places. The main idea is simple. Take the Chief Executive Officer of a company and put him or her in the position of one of the company's low-end workers.\nDonald Eisner is the CEO of the Absalon chain of hotels in Australia. His family have been hotel owners for three generations and are one of the wealthiest in the Australian hotel industry. In the program, we see Donald Eisner working as a bellboy, cook and cleaner while supervisors monitor his performance, noting any mistakes. He has some triumphs, it is true. In the kitchen, he successfully cooks several pancakes, for example, and, as a housekeeper, he makes the beds correctly. The rest of his housekeeping, however, is not a success, as he fails to clean any rooms to the company's required standards. At the end of the program, we see his supervisor taking him from room to room, pointing out his mistakes.\nAlex Jennings runs a successful chain of steak bars called Wayside Inn. He has a reputation for demanding quality from his staff, both in terms of food and service. When he changes places with some of his staff, we see him fail a number of tasks in the restaurant. As a waiter, he continually forgets to ask customers how they want their steaks to be done and mixes up the orders completely when he has to serve five tables at the same time. A few minutes later, disaster strikes when his tie becomes caught under the drinks on a tray! The next day, when he takes the place of the cook, his supervisor makes him redo several of the steaks."}, {"q": "Donald Eisner can cook pancakes.", "o": ["TRUE", "FALSE", "NOT GIVEN"], "a": 0, "n": 57, "g": "Reading (32)", "p": "Many critics dislike reality TV but one show which has received very favorable reviews is Changing Places. The main idea is simple. Take the Chief Executive Officer of a company and put him or her in the position of one of the company's low-end workers.\nDonald Eisner is the CEO of the Absalon chain of hotels in Australia. His family have been hotel owners for thr
